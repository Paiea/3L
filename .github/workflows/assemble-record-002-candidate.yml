name: Assemble Record 002 candidate

on:
  push:
    branches: [setup/ai-first-reader]
    paths: [.github/workflows/assemble-record-002-candidate.yml]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: setup/ai-first-reader
          fetch-depth: 0
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Assemble with deliberate pauses
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, urllib.request
          from pathlib import Path

          root = Path('.')
          captures = json.loads((root/'audio/production/record-002/captures.json').read_text())
          plan = json.loads((root/'audio/production/record-002/route-plan.json').read_text())
          assert captures['source_sha256'] == plan['source_sha256']
          assert [s['index'] for s in captures['segments']] == [s['index'] for s in plan['segments']]

          work = Path('/tmp/record-002-v2')
          work.mkdir(parents=True, exist_ok=True)
          concat = []
          for item in captures['segments']:
              i = item['index']
              mp3 = work / f'{i:03d}.mp3'
              wav = work / f'{i:03d}.wav'
              urllib.request.urlretrieve(item['preview_url'], mp3)
              subprocess.run(['ffmpeg','-y','-loglevel','error','-i',str(mp3),'-ar','24000','-ac','1','-c:a','pcm_s16le',str(wav)],check=True)
              concat.append(wav)
              ms = int(item['pause_after_ms'])
              if ms:
                  silence = work / f'{i:03d}-silence.wav'
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-f','lavfi','-i','anullsrc=r=24000:cl=mono','-t',f'{ms/1000:.3f}','-c:a','pcm_s16le',str(silence)],check=True)
                  concat.append(silence)

          list_file = work/'concat.txt'
          list_file.write_text(''.join(f"file '{p}'\n" for p in concat))
          out = root/'audio/assets/record-002-quote-locked-v2.mp3'
          out.parent.mkdir(parents=True, exist_ok=True)
          subprocess.run(['ffmpeg','-y','-loglevel','error','-f','concat','-safe','0','-i',str(list_file),'-c:a','libmp3lame','-b:a','128k',str(out)],check=True)
          duration = float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(out)],text=True).strip())
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          verification = {
              'record': '002',
              'status': 'candidate_unlistened',
              'routing_mode': 'exact_quote_locked',
              'uses_timestamps_for_speaker_assignment': False,
              'source_sha256': plan['source_sha256'],
              'segment_count': len(captures['segments']),
              'duration_seconds': round(duration, 3),
              'sha256': digest,
              'asset': 'audio/assets/record-002-quote-locked-v2.mp3',
              'note': 'Listen before publication. Wider handoff pauses; 1.4s after Ithar Ah; 80ms only at one mid-sentence Ithar clip split.'
          }
          (root/'audio/production/record-002/verification-v2.json').write_text(json.dumps(verification,indent=2)+'\n')
          print(json.dumps(verification, indent=2))
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/assets/record-002-quote-locked-v2.mp3 audio/production/record-002/verification-v2.json
          git commit -m "audio: assemble quote-locked Record 002 candidate"
          git pull --rebase origin setup/ai-first-reader
          git push origin HEAD:setup/ai-first-reader
