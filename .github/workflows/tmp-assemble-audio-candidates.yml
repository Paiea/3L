name: Temporary assemble audio candidates

on:
  push:
    branches: [setup/ai-first-reader]
    paths: [.github/workflows/tmp-assemble-audio-candidates.yml]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: setup/ai-first-reader
          fetch-depth: 0
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verify routes and assemble candidates
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_audio_routing -v
          python - <<'PY'
          import hashlib, json, subprocess, urllib.request
          from pathlib import Path

          root = Path('.')
          records = ['001','003','004','005','006','007','008','009','010']
          audio_manifest_path = root/'audio/manifest.json'
          audio_manifest = json.loads(audio_manifest_path.read_text())
          audio_manifest.setdefault('records', {})

          for record in records:
              prod = root/f'audio/production/record-{record}'
              captures = json.loads((prod/'captures.json').read_text())
              plan = json.loads((prod/'route-plan.json').read_text())
              source_path = root/f'manuscript/records/{record}/current.md'
              source_hash = hashlib.sha256(source_path.read_bytes()).hexdigest()

              assert plan['record'] == record, (record, plan['record'])
              assert plan['routing_mode'] == 'exact_quote_locked'
              assert plan.get('uses_timestamps_for_speaker_assignment') is False
              assert plan['source_sha256'] == source_hash, f'{record}: route plan stale vs manuscript'
              assert captures['source_sha256'] == source_hash, f'{record}: captures stale vs manuscript'
              assert captures['routing_mode'] == 'exact_quote_locked'
              assert captures['status'] == 'candidate_unlistened'
              assert ''.join(s['transcript'] for s in plan['segments']) == plan['audio_body']
              assert len(plan['segments']) == len(captures['segments'])

              for p, c in zip(plan['segments'], captures['segments']):
                  assert p['index'] == c['index'], f'{record}: capture index mismatch'
                  assert int(p['pause_after_ms']) == int(c['pause_after_ms']), f'{record}: pause mismatch at {p["index"]}'
                  if p['speaker'] == 'greg':
                      assert p['voice_id'] == 'deep', f'{record}: Greg voice mismatch at {p["index"]}'
                  elif p['speaker'] == 'ithar':
                      assert p['voice_id'] == 'normal', f'{record}: Ithar voice mismatch at {p["index"]}'
                  else:
                      raise AssertionError(f'{record}: unknown speaker {p["speaker"]}')

              work = Path(f'/tmp/record-{record}-v2')
              work.mkdir(parents=True, exist_ok=True)
              concat = []
              for item in captures['segments']:
                  i = item['index']
                  mp3 = work/f'{i:03d}.mp3'
                  wav = work/f'{i:03d}.wav'
                  urllib.request.urlretrieve(item['preview_url'], mp3)
                  subprocess.run([
                      'ffmpeg','-y','-loglevel','error','-i',str(mp3),
                      '-ar','24000','-ac','1','-c:a','pcm_s16le',str(wav)
                  ], check=True)
                  concat.append(wav)
                  ms = int(item['pause_after_ms'])
                  if ms:
                      silence = work/f'{i:03d}-silence.wav'
                      subprocess.run([
                          'ffmpeg','-y','-loglevel','error','-f','lavfi','-i','anullsrc=r=24000:cl=mono',
                          '-t',f'{ms/1000:.3f}','-c:a','pcm_s16le',str(silence)
                      ], check=True)
                      concat.append(silence)

              list_file = work/'concat.txt'
              list_file.write_text(''.join(f"file '{p}'\n" for p in concat))
              asset = f'audio/assets/record-{record}-quote-locked-v2.mp3'
              out = root/asset
              out.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run([
                  'ffmpeg','-y','-loglevel','error','-f','concat','-safe','0','-i',str(list_file),
                  '-c:a','libmp3lame','-b:a','128k',str(out)
              ], check=True)
              duration = float(subprocess.check_output([
                  'ffprobe','-v','error','-show_entries','format=duration',
                  '-of','default=noprint_wrappers=1:nokey=1',str(out)
              ], text=True).strip())
              digest = hashlib.sha256(out.read_bytes()).hexdigest()

              verification = {
                  'record': record,
                  'status': 'candidate_unlistened',
                  'routing_mode': 'exact_quote_locked',
                  'uses_timestamps_for_speaker_assignment': False,
                  'source_sha256': source_hash,
                  'segment_count': len(captures['segments']),
                  'duration_seconds': round(duration, 3),
                  'sha256': digest,
                  'asset': asset,
                  'note': 'Listen before publication. Assembly uses validated per-segment pause_after_ms and the Record 002 normalization/concatenation recipe.'
              }
              (prod/'verification-v2.json').write_text(json.dumps(verification, indent=2) + '\n')
              audio_manifest['records'][f'r{record}'] = {
                  'status': 'candidate',
                  'src': asset,
                  'source_sha256': source_hash,
                  'audio_sha256': digest,
                  'duration_seconds': round(duration, 3),
                  'routing_mode': 'exact_quote_locked',
                  'listened': False
              }
              print(json.dumps(verification, indent=2))

          audio_manifest_path.write_text(json.dumps(audio_manifest, indent=2) + '\n')
          PY
      - name: Commit assembled candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/assets/record-001-quote-locked-v2.mp3 \
                  audio/assets/record-003-quote-locked-v2.mp3 \
                  audio/assets/record-004-quote-locked-v2.mp3 \
                  audio/assets/record-005-quote-locked-v2.mp3 \
                  audio/assets/record-006-quote-locked-v2.mp3 \
                  audio/assets/record-007-quote-locked-v2.mp3 \
                  audio/assets/record-008-quote-locked-v2.mp3 \
                  audio/assets/record-009-quote-locked-v2.mp3 \
                  audio/assets/record-010-quote-locked-v2.mp3 \
                  audio/production/record-001/verification-v2.json \
                  audio/production/record-003/verification-v2.json \
                  audio/production/record-004/verification-v2.json \
                  audio/production/record-005/verification-v2.json \
                  audio/production/record-006/verification-v2.json \
                  audio/production/record-007/verification-v2.json \
                  audio/production/record-008/verification-v2.json \
                  audio/production/record-009/verification-v2.json \
                  audio/production/record-010/verification-v2.json \
                  audio/manifest.json
          git commit -m "audio: assemble quote-locked Records 001 and 003-010 candidates"
          git pull --rebase origin setup/ai-first-reader
          git push origin HEAD:setup/ai-first-reader
