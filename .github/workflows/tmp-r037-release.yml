name: Temporary Record 037 Release

on:
  push:
    branches: [audio/record-037-release]
    paths:
      - .github/workflows/tmp-r037-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/record-037-release
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import verified Record 037 production
        run: |
          set -euo pipefail
          git fetch --depth=1 origin audio/record-037-production
          git checkout FETCH_HEAD -- audio/routing/record-037.json audio/production/record-037 audio/assets/record-037-quote-locked-v2.mp3
          test -f audio/production/record-037/verification-v2.json
          test -f audio/production/record-037/captures.json
          test -f audio/assets/record-037-quote-locked-v2.mp3
      - name: Advance manifest only after verification
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          source_hash='87721e79c7560190a7e02fb6cd16f5c85a6a2118e26486a434362ed6e81ae6f5'
          audio_hash='6539c56bc9a01c1da6f70d9a9c8bf6981077cdda8109a642cb660a2c3f94fcae'
          duration=1125.648
          source=Path('manuscript/records/037/current.md').read_text(encoding='utf-8')
          assert hashlib.sha256(source.encode('utf-8')).hexdigest()==source_hash
          asset=Path('audio/assets/record-037-quote-locked-v2.mp3')
          assert hashlib.sha256(asset.read_bytes()).hexdigest()==audio_hash
          verification=json.loads(Path('audio/production/record-037/verification-v2.json').read_text(encoding='utf-8'))
          assert verification['record']=='037'
          assert verification['status']=='assembled_unlistened'
          assert verification['routing_mode']=='exact_quote_locked'
          assert verification['uses_timestamps_for_speaker_assignment'] is False
          assert verification['source_sha256']==source_hash
          assert verification['segment_count']==92
          assert len(verification['ithar_segment_indices'])==28
          assert verification['duration_seconds']==duration
          assert verification['sha256']==audio_hash
          manifest_path=Path('audio/manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['records']['r036']['status']=='published'
          manifest['records']['r037']={
            'status':'published',
            'src':'audio/assets/record-037-quote-locked-v2.mp3',
            'source_sha256':source_hash,
            'audio_sha256':audio_hash,
            'duration_seconds':duration,
            'routing_mode':'exact_quote_locked',
            'listened':False,
          }
          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('Staged Record 037 manifest advancement')
          PY
      - name: Validate clean release
        run: |
          set -euo pipefail
          python scripts/audio_route.py manuscript/records/037/current.md audio/routing/record-037.json /tmp/route-037-release.json
          python - <<'PY'
          import json
          from pathlib import Path
          route=json.loads(Path('/tmp/route-037-release.json').read_text(encoding='utf-8'))
          prepared=json.loads(Path('audio/production/record-037/route-plan.json').read_text(encoding='utf-8'))
          assert route==prepared
          assert ''.join(s['transcript'] for s in route['segments'])==route['audio_body']
          assert [s['index'] for s in route['segments']]==list(range(1,93))
          assert sum(s['speaker']=='ithar' for s in route['segments'])==28
          PY
          python scripts/check_repo.py
          python -m unittest discover -v
      - name: Commit staged Record 037 release
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audio/manifest.json audio/routing/record-037.json audio/production/record-037 audio/assets/record-037-quote-locked-v2.mp3
          git commit -m 'Publish Record 037 production audio'
          git push origin HEAD:audio/record-037-release
