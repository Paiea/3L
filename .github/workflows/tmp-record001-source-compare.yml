name: Temporary Record 001 source compare

on:
  push:
    branches: [setup/ai-first-reader]
    paths:
      - '.github/workflows/tmp-record001-source-compare.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare legacy takes with current audio body
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Paiea/peg-leg-greg-reader.git /tmp/old
          python - <<'PY'
          import json, difflib
          from pathlib import Path
          old = json.loads(Path('/tmp/old/3l/audio/record-001-short-takes.json').read_text())
          new = json.loads(Path('audio/production/record-001/route-plan.json').read_text())
          old_body = ''.join(t['transcript'] for t in old['takes'])
          new_body = new['audio_body']
          print('old_chars', len(old_body))
          print('new_chars', len(new_body))
          print('exact_equal', old_body == new_body)
          sm = difflib.SequenceMatcher(a=old_body, b=new_body, autojunk=False)
          print('similarity', round(sm.ratio(), 6))
          ops = [op for op in sm.get_opcodes() if op[0] != 'equal']
          print('non_equal_opcodes', len(ops))
          for n,(tag,i1,i2,j1,j2) in enumerate(ops[:20],1):
              print(f'OP {n} {tag} old[{i1}:{i2}] new[{j1}:{j2}]')
              print('OLD', repr(old_body[i1:i2][:220]))
              print('NEW', repr(new_body[j1:j2][:220]))
          PY
