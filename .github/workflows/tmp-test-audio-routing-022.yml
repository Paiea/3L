name: Temporary audio routing 022 regression

on:
  push:
    branches: [audio/capture-022]
    paths:
      - scripts/audio_route.py
      - tests/test_audio_routing.py
      - .github/workflows/tmp-test-audio-routing-022.yml

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/capture-022
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run straight quote routing regression
        run: python -m unittest tests.test_audio_routing.AudioRoutingTests.test_straight_quotes_can_be_locked_to_ithar -v
