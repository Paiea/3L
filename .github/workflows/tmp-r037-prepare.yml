name: Temporary Record 037 Prepare

on:
  push:
    branches: [audio/record-037-production]
    paths:
      - .github/workflows/tmp-r037-prepare.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/record-037-production
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reviewed exact quote routing and work orders
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from scripts.audio_route import build_plan

          record='037'
          reviewed=[1,3,5,7,9,12,14,76,78,82,84,86,88,90,92,160,162,164,166,168,170,172,174,176,178,180,182,184]
          source_path=Path(f'manuscript/records/{record}/current.md')
          source=source_path.read_text(encoding='utf-8')
          source_hash=hashlib.sha256(source.encode('utf-8')).hexdigest()
          inventory=json.loads(Path(f'audio/production/record-{record}/quote-inventory.json').read_text(encoding='utf-8'))
          assert inventory['quote_count']==212
          rows={r['quote_index']:r for r in inventory['quotes']}
          locks=[{'text':rows[i]['text'],'occurrence':rows[i]['occurrence']} for i in reviewed]
          config={
            'record':record,
            'routing_mode':'exact_quote_locked',
            'voices':{'greg':'deep','ithar':'normal'},
            'max_chars':480,
            'pause_ms':{'continuation':220,'paragraph':450,'action':700,'speaker_handoff':1100,'major_beat':1400},
            'dragon_quotes':locks,
          }
          routing_path=Path(f'audio/routing/record-{record}.json')
          routing_path.parent.mkdir(parents=True,exist_ok=True)
          routing_path.write_text(json.dumps(config,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          reviewed_path=Path(f'audio/production/record-{record}/reviewed-ithar-quote-indices.json')
          reviewed_path.write_text(json.dumps({'record':record,'source_sha256':source_hash,'quote_count':212,'ithar_quote_indices':reviewed},indent=2)+'\n',encoding='utf-8')
          plan=build_plan(source,config)
          assert plan['source_sha256']==source_hash
          assert plan['routing_mode']=='exact_quote_locked'
          assert plan['uses_timestamps_for_speaker_assignment'] is False
          assert ''.join(s['transcript'] for s in plan['segments'])==plan['audio_body']
          assert all(len(s['transcript'])<=480 for s in plan['segments'])
          assert all((s['speaker']=='greg' and s['voice_id']=='deep') or (s['speaker']=='ithar' and s['voice_id']=='normal') for s in plan['segments'])
          route_path=Path(f'audio/production/record-{record}/route-plan.json')
          route_path.write_text(json.dumps(plan,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          workdir=Path(f'audio/production/record-{record}/work-orders')
          workdir.mkdir(parents=True,exist_ok=True)
          for old in workdir.glob('segments-*.json'): old.unlink()
          segs=plan['segments']
          for start in range(0,len(segs),5):
              chunk=segs[start:start+5]
              a=chunk[0]['index']; b=chunk[-1]['index']
              payload={'record':record,'source_sha256':source_hash,'routing_mode':'exact_quote_locked','segments':chunk}
              (workdir/f'segments-{a:03d}-{b:03d}.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('source_sha256',source_hash)
          print('segments',len(segs),'ithar_segments',sum(s['speaker']=='ithar' for s in segs))
          PY
          python scripts/check_repo.py
          python -m unittest discover -v
      - name: Commit prepared Record 037 production
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audio/routing/record-037.json audio/production/record-037/reviewed-ithar-quote-indices.json audio/production/record-037/route-plan.json audio/production/record-037/work-orders
          git commit -m 'Prepare Record 037 exact quote audio routing'
          git push origin HEAD:audio/record-037-production
