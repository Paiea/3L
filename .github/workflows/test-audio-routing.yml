name: Test audio routing

on:
  push:
    branches: [setup/ai-first-reader]
    paths:
      - 'audio/**'
      - 'scripts/**'
      - 'tests/test_audio_routing.py'
      - '.github/workflows/test-audio-routing.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_audio_routing -v
