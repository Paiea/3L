name: Temporary publish audio 020

on:
  push:
    branches: [release/audio-020]
    paths:
      - .github/workflows/tmp-publish-audio-020.yml
      - scripts/tmp_publish_audio_020.py

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/audio-020
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Assemble release
        run: python scripts/tmp_publish_audio_020.py
      - name: Validate release
        run: |
          python -m unittest -v
          python scripts/check_repo.py
      - name: Commit release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/assets/record-020-quote-locked-v2.mp3 audio/production/record-020/captures.json audio/production/record-020/route-plan.json audio/production/record-020/verification-v2.json audio/manifest.json manuscript/manifest.json tests/test_repo_contract.py
          git commit -m "Publish Record 020 with audio"
          git push origin HEAD:release/audio-020
