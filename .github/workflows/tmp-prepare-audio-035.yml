name: Temporary prepare audio 035

on:
  push:
    branches: [audio/capture-035]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/capture-035
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact quote locks, route, and work orders
        run: |
          python - <<'PY'
          import hashlib, json
          from collections import defaultdict
          from pathlib import Path
          from scripts.audio_route import manuscript_body, quoted_spans, build_plan

          source_path=Path('manuscript/records/035/current.md')
          source=source_path.read_text(encoding='utf-8')
          source_sha=hashlib.sha256(source_path.read_bytes()).hexdigest()
          assert source_sha=='7056bfbf522d9bde24de9d41bb71886fbc4f6507aa7cce7b57c1da0a3fe0621e', source_sha

          ithar_ordinals={
            10,12,14,16,18,20,
            25,27,29,31,33,35,37,39,
            41,44,46,50,52,54,56,58,60,62,64,66,68,70,72,73,75,77,79,
            80,82,84,86,88,90,92,94,96,98,100,103,105,107,109,111,113,116,
            120,122,124,126,128,130,133,137,140,142,145,147,
            149,151,153,155,157,159,162,164,166,168,170,
            171,173,175,177,179,181,183,186,188,190,192,194,197,199,
            203,205,206,207,209,211,213,215,217,219,221,222,224,226,228,230,231,232,233,
            235,237,239,241,243,245,247,249,253,255,257,259,262,264,268
          }
          body=manuscript_body(source)
          found=[q for _,_,q in quoted_spans(body)]
          assert len(found)==269, len(found)
          assert max(ithar_ordinals)<=len(found)

          seen=defaultdict(int)
          locks=[]
          for ordinal,q in enumerate(found,1):
              seen[q]+=1
              if ordinal in ithar_ordinals:
                  locks.append({'text':q,'occurrence':seen[q]})
          assert len(locks)==122, len(locks)

          config={
            'record':'035',
            'routing_mode':'exact_quote_locked',
            'voices':{'greg':'deep','ithar':'normal'},
            'max_chars':480,
            'pause_ms':{
              'continuation':220,'paragraph':450,'action':700,
              'speaker_handoff':1100,'major_beat':1400
            },
            'dragon_quotes':locks
          }
          routing=Path('audio/routing/record-035.json')
          routing.parent.mkdir(parents=True,exist_ok=True)
          routing.write_text(json.dumps(config,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          plan=build_plan(source,config)
          assert plan['source_sha256']==source_sha
          assert plan['uses_timestamps_for_speaker_assignment'] is False
          assert all(len(s['transcript'])<=480 for s in plan['segments'])
          assert all(not (s['speaker']=='greg' and s['voice_id']!='deep') for s in plan['segments'])
          assert all(not (s['speaker']=='ithar' and s['voice_id']!='normal') for s in plan['segments'])
          if plan['segments']:
              plan['segments'][-1]['pause_after_ms']=220

          prod=Path('audio/production/record-035')
          wo=prod/'work-orders'
          wo.mkdir(parents=True,exist_ok=True)
          (prod/'route-plan.json').write_text(json.dumps(plan,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          for old in wo.glob('segments-*.json'):
              old.unlink()
          segments=plan['segments']
          for start in range(0,len(segments),10):
              chunk=segments[start:start+10]
              name=f"segments-{chunk[0]['index']:03d}-{chunk[-1]['index']:03d}.json"
              payload={
                'record':'035','source_sha256':source_sha,
                'routing_mode':'exact_quote_locked','segments':chunk
              }
              (wo/name).write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          ithar_segments=[s['index'] for s in segments if s['speaker']=='ithar']
          print('source_sha256',source_sha)
          print('quote_locks',len(locks))
          print('segments',len(segments))
          print('ithar_segments',len(ithar_segments))
          print('greg_segments',len(segments)-len(ithar_segments))
          print('work_orders',(len(segments)+9)//10)
          print('last_pause',segments[-1]['pause_after_ms'])
          PY
      - name: Verify routing tests
        run: |
          python -m unittest tests.test_audio_routing -v
          python scripts/check_repo.py
      - name: Commit prepared Record 035 route
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/routing/record-035.json audio/production/record-035
          git commit -m "audio: prepare Record 035 route"
          git push origin HEAD:audio/capture-035
