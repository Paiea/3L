name: Build audio route plans 003-010

on:
  push:
    branches: [setup/ai-first-reader]
    paths: [.github/workflows/build-audio-route-plans-003-010.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: setup/ai-first-reader
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact route plans
        run: |
          set -euo pipefail
          for n in 003 004 005 006 007 008 009 010; do
            mkdir -p "audio/production/record-$n"
            python scripts/audio_route.py \
              "manuscript/records/$n/current.md" \
              "audio/routing/record-$n.json" \
              "audio/production/record-$n/route-plan.json"
          done
          python scripts/check_repo.py
          python -m unittest discover -v
      - name: Commit route plans
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/production/record-{003,004,005,006,007,008,009,010}/route-plan.json
          git commit -m "audio: build route plans 003-010"
          git pull --rebase origin setup/ai-first-reader
          git push origin HEAD:setup/ai-first-reader
