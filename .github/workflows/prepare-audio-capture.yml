name: Prepare audio capture routes

on:
  push:
    branches: [audio/capture-011-020]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/capture-011-020
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate validated route plans for 011-020
        run: |
          set -euo pipefail
          for i in $(seq 11 20); do
            n=$(printf '%03d' "$i")
            mkdir -p "audio/production/record-${n}"
            python scripts/audio_route.py \
              "manuscript/records/${n}/current.md" \
              "audio/routing/record-${n}.json" \
              "audio/production/record-${n}/route-plan.json"
          done
          python -m unittest tests.test_audio_routing -v
      - name: Validate captured segment manifests for 011-020
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          verified = 0
          for i in range(11, 21):
              slot = f'{i:03d}'
              capture_path = Path(f'audio/production/record-{slot}/captures.json')
              if not capture_path.exists():
                  continue
              route_path = capture_path.with_name('route-plan.json')
              capture = json.loads(capture_path.read_text(encoding='utf-8'))
              route = json.loads(route_path.read_text(encoding='utf-8'))
              assert capture['source_sha256'] == route['source_sha256'], capture_path
              assert capture['routing_mode'] == route['routing_mode'], capture_path
              csegs = capture['segments']
              rsegs = route['segments']
              assert len(csegs) == len(rsegs), (capture_path, len(csegs), len(rsegs))
              assert [s['index'] for s in csegs] == [s['index'] for s in rsegs], capture_path
              for captured, routed in zip(csegs, rsegs):
                  assert captured['pause_after_ms'] == routed['pause_after_ms'], (capture_path, captured['index'])
                  assert captured['preview_url'].startswith('https://'), (capture_path, captured['index'])
              verified += 1
              print(f'verified {capture_path}: {len(csegs)} segments')
          print(f'verified batch capture manifests: {verified}')
          PY
      - name: Commit generated route plans
        run: |
          if [ -z "$(git status --porcelain -- audio/production/record-*/route-plan.json)" ]; then
            echo "route plans already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/production/record-*/route-plan.json
          git commit -m "audio: materialize route plans 011-020"
          git push origin HEAD:audio/capture-011-020
