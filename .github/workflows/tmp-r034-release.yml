name: Temporary Record 034 Clean Release

on:
  push:
    branches: [audio/record-034-release]
    paths:
      - .github/workflows/tmp-r034-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/record-034-release
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import verified Record 034 production artifacts
        run: |
          set -euo pipefail
          git fetch origin audio/record-034-production
          git checkout origin/audio/record-034-production -- \
            audio/assets/record-034-quote-locked-v2.mp3 \
            audio/production/record-034 \
            audio/routing/record-034.json
      - name: Advance audio manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest_path=Path('audio/manifest.json')
          verification_path=Path('audio/production/record-034/verification-v2.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          verification=json.loads(verification_path.read_text(encoding='utf-8'))
          assert verification['record']=='034'
          assert verification['status']=='assembled_unlistened'
          assert verification['segment_count']==35
          assert verification['ithar_segment_indices']==[]
          manifest['records']['r034']={
              'status':'published',
              'src':verification['asset'],
              'source_sha256':verification['source_sha256'],
              'audio_sha256':verification['sha256'],
              'duration_seconds':verification['duration_seconds'],
              'routing_mode':verification['routing_mode'],
              'listened':False,
          }
          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(manifest['records']['r034'],indent=2))
          PY
      - name: Verify clean release contract
        run: |
          python scripts/check_repo.py
          python -m unittest discover -v
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          v=json.loads(Path('audio/production/record-034/verification-v2.json').read_text())
          m=json.loads(Path('audio/manifest.json').read_text())['records']['r034']
          asset=Path(v['asset'])
          assert m['status']=='published'
          assert m['src']==v['asset']=='audio/assets/record-034-quote-locked-v2.mp3'
          assert m['source_sha256']==v['source_sha256']=='b2b682537b9fdfbe1b22272d3111b1258f30c925f6676146073fcc24440355f7'
          assert m['audio_sha256']==v['sha256']=='f384a9e263a5c3fcdff0ba5802b6a3f987785964c87259a8e390dff87ea08ac7'
          assert hashlib.sha256(asset.read_bytes()).hexdigest()==v['sha256']
          assert m['duration_seconds']==v['duration_seconds']==945.48
          assert m['routing_mode']=='exact_quote_locked'
          assert m['listened'] is False
          assert v['ithar_segment_indices']==[]
          print('Record 034 clean release verification passed')
          PY
      - name: Commit clean release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            audio/assets/record-034-quote-locked-v2.mp3 \
            audio/production/record-034 \
            audio/routing/record-034.json \
            audio/manifest.json
          git commit -m 'Stage Record 034 audio release'
          git push origin HEAD:audio/record-034-release
