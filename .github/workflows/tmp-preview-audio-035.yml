name: Temporary preview audio 035

on:
  push:
    branches: [audio/capture-035]

permissions:
  contents: write

jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/capture-035
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Assemble opening preview
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,urllib.request
          from pathlib import Path
          root=Path('.')
          part=json.loads((root/'audio/production/record-035/capture-parts/segments-001-010.json').read_text())
          route=json.loads((root/'audio/production/record-035/route-plan.json').read_text())
          assert part['source_sha256']==route['source_sha256']=='7056bfbf522d9bde24de9d41bb71886fbc4f6507aa7cce7b57c1da0a3fe0621e'
          work=Path('/tmp/035-opening'); work.mkdir(parents=True,exist_ok=True)
          concat=[]
          for cap in part['segments']:
              r=route['segments'][cap['index']-1]
              assert cap['pause_after_ms']==r['pause_after_ms']
              i=cap['index']; mp3=work/f'{i:03d}.mp3'; wav=work/f'{i:03d}.wav'
              urllib.request.urlretrieve(cap['preview_url'],mp3)
              subprocess.run(['ffmpeg','-y','-loglevel','error','-i',str(mp3),'-ar','24000','-ac','1','-c:a','pcm_s16le',str(wav)],check=True)
              concat.append(wav)
              ms=int(cap['pause_after_ms'])
              silence=work/f'{i:03d}-silence.wav'
              subprocess.run(['ffmpeg','-y','-loglevel','error','-f','lavfi','-i','anullsrc=r=24000:cl=mono','-t',f'{ms/1000:.3f}','-c:a','pcm_s16le',str(silence)],check=True)
              concat.append(silence)
          lf=work/'concat.txt'; lf.write_text(''.join(f"file '{p}'\n" for p in concat))
          out=root/'audio/previews/record-035-opening-001-010.mp3'; out.parent.mkdir(parents=True,exist_ok=True)
          subprocess.run(['ffmpeg','-y','-loglevel','error','-f','concat','-safe','0','-i',str(lf),'-c:a','libmp3lame','-b:a','128k',str(out)],check=True)
          duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(out)],text=True).strip())
          meta={'record':'035','kind':'opening_preview','segments':[1,10],'duration_seconds':round(duration,3),'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'listened':False,'note':'Stitched production-cadence preview only; full Record 035 capture remains incomplete.'}
          (root/'audio/previews/record-035-opening-001-010.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          PY
      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/previews/record-035-opening-001-010.mp3 audio/previews/record-035-opening-001-010.json
          git commit -m "audio: assemble Record 035 opening preview"
          git push origin HEAD:audio/capture-035
