name: Inspect Record 001 quotes

on:
  push:
    branches: [setup/ai-first-reader]
    paths: [.github/workflows/inspect-record-001-quotes.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          from scripts.audio_route import manuscript_body, quoted_spans
          source=Path('manuscript/records/001/current.md').read_text(encoding='utf-8')
          quotes=[q for _,_,q in quoted_spans(manuscript_body(source))]
          counts=Counter(quotes)
          for i,q in enumerate(quotes,1):
              preview=' '.join(q.split())
              if len(preview)>150:
                  preview=preview[:147]+'...'
              occurrence=quotes[:i].count(q)
              suffix=f' occurrence={occurrence}/{counts[q]}' if counts[q]>1 else ''
              print(f'{i:03d}{suffix} {preview}')
          print('TOTAL_QUOTES',len(quotes))
          PY
