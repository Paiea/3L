name: Temporary publish prose 039

on:
  push:
    branches: [release/prose-038]

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/prose-038
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish current prose through 039
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          p=root/'manuscript/manifest.json'
          data=json.loads(p.read_text(encoding='utf-8'))
          def count_words(text):
              return sum(1 for token in text.split() if token != '##')
          for rec in data['records']:
              slot=rec['slot']
              current=root/rec['path']
              original=root/f'manuscript/records/{slot}/versions/original-run.md'
              if current.exists() and original.exists() and current.read_bytes()!=original.read_bytes() and rec['prose_status']=='needs_rehearsal':
                  rec['prose_status']='restored'
                  rec['word_count']=count_words(current.read_text(encoding='utf-8'))
              rec['published']=int(slot)<=39
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          t=root/'tests/test_repo_contract.py'
          s=t.read_text(encoding='utf-8')
          s=s.replace('records[:36]))','records[:39]))')
          s=s.replace('records[36:]))','records[39:]))')
          t.write_text(s,encoding='utf-8')
          PY
      - name: Verify repository
        run: |
          python scripts/check_repo.py
          python -m unittest discover -v
      - name: Commit prose publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/manifest.json tests/test_repo_contract.py
          git commit -m "Publish prose through Record 039"
          git push origin HEAD:release/prose-038
