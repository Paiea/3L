name: Temporary assemble audio 023

on:
  push:
    branches: [audio/capture-023]

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/capture-023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verify frozen capture manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          source = Path('manuscript/records/023/current.md')
          plan = json.loads(Path('audio/production/record-023/route-plan.json').read_text())
          caps = json.loads(Path('audio/production/record-023/captures.json').read_text())
          source_sha = hashlib.sha256(source.read_bytes()).hexdigest()
          assert source_sha == '04f54f4f69992bfbd177b6c4b5247c2eabe0b56079716869d7ff5aaa377f29be'
          assert plan['source_sha256'] == source_sha == caps['source_sha256']
          assert plan['record'] == caps['record'] == '023'
          assert plan['routing_mode'] == caps['routing_mode'] == 'exact_quote_locked'
          assert caps['status'] == 'candidate_unlistened'
          assert len(plan['segments']) == len(caps['segments']) == 35
          assert all(s['speaker'] == 'greg' and s['voice_id'] == 'deep' for s in plan['segments'])
          for route, cap in zip(plan['segments'], caps['segments']):
              assert route['index'] == cap['index']
              assert int(route['pause_after_ms']) == int(cap['pause_after_ms'])
              assert cap['preview_url'].startswith('https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/')
          assert caps['segments'][-1]['pause_after_ms'] == 220
          print('verified source sha', source_sha)
          print('verified segments', len(caps['segments']))
          PY
      - name: Deterministically assemble preview takes
        run: |
          set -euo pipefail
          mkdir -p audio/assets
          python - <<'PY'
          import hashlib, json, subprocess, urllib.request
          from pathlib import Path

          source = Path('manuscript/records/023/current.md')
          prod = Path('audio/production/record-023')
          route = json.loads((prod/'route-plan.json').read_text(encoding='utf-8'))
          captures = json.loads((prod/'captures.json').read_text(encoding='utf-8'))
          source_hash = hashlib.sha256(source.read_bytes()).hexdigest()
          assert source_hash == route['source_sha256'] == captures['source_sha256']
          assert len(route['segments']) == len(captures['segments']) == 35
          for r, c in zip(route['segments'], captures['segments']):
              assert r['index'] == c['index']
              assert int(r['pause_after_ms']) == int(c['pause_after_ms'])

          work = Path('/tmp/record-023')
          work.mkdir(parents=True, exist_ok=True)
          concat = []
          for item in captures['segments']:
              i = item['index']
              mp3 = work/f'{i:03d}.mp3'
              wav = work/f'{i:03d}.wav'
              urllib.request.urlretrieve(item['preview_url'], mp3)
              subprocess.run([
                  'ffmpeg','-y','-loglevel','error','-i',str(mp3),
                  '-ar','24000','-ac','1','-c:a','pcm_s16le',str(wav)
              ], check=True)
              concat.append(wav)
              ms = int(item['pause_after_ms'])
              if ms:
                  silence = work/f'{i:03d}-silence.wav'
                  subprocess.run([
                      'ffmpeg','-y','-loglevel','error','-f','lavfi','-i',
                      'anullsrc=r=24000:cl=mono','-t',f'{ms/1000:.3f}',
                      '-c:a','pcm_s16le',str(silence)
                  ], check=True)
                  concat.append(silence)

          list_file = work/'concat.txt'
          list_file.write_text(''.join(f"file '{p}'\n" for p in concat), encoding='utf-8')
          asset = Path('audio/assets/record-023-quote-locked-v2.mp3')
          subprocess.run([
              'ffmpeg','-y','-loglevel','error','-f','concat','-safe','0',
              '-i',str(list_file),'-c:a','libmp3lame','-b:a','128k',str(asset)
          ], check=True)
          duration = float(subprocess.check_output([
              'ffprobe','-v','error','-show_entries','format=duration',
              '-of','default=noprint_wrappers=1:nokey=1',str(asset)
          ], text=True).strip())
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          verification = {
              'record': '023',
              'status': 'assembled_unlistened',
              'routing_mode': 'exact_quote_locked',
              'uses_timestamps_for_speaker_assignment': False,
              'source_sha256': source_hash,
              'segment_count': 35,
              'ithar_segment_indices': [],
              'duration_seconds': round(duration, 3),
              'sha256': digest,
              'asset': str(asset),
              'note': 'Deterministically assembled from structurally verified candidate takes; auditory listen-back and public release remain pending.'
          }
          (prod/'verification-v2.json').write_text(json.dumps(verification, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(verification, indent=2))
          PY
      - name: Verify assembled asset metadata
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          v = json.loads(Path('audio/production/record-023/verification-v2.json').read_text())
          asset = Path(v['asset'])
          assert asset.exists() and asset.stat().st_size > 0
          assert hashlib.sha256(asset.read_bytes()).hexdigest() == v['sha256']
          assert v['segment_count'] == 35
          assert v['duration_seconds'] > 0
          print('asset sha', v['sha256'])
          print('duration', v['duration_seconds'])
          PY
      - name: Commit assembled candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/assets/record-023-quote-locked-v2.mp3 audio/production/record-023/verification-v2.json
          git commit -m "audio: assemble Record 023 candidate"
          git push origin HEAD:audio/capture-023
