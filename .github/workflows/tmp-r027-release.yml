name: Temporary Record 027 Release
on:
  push:
    branches: [audio/record-027-release]
    paths: [.github/workflows/tmp-r027-release.yml]
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: audio/record-027-release, fetch-depth: 0}
      - name: Import verified 027 audio
        run: |
          git fetch origin audio/record-027-production
          git checkout origin/audio/record-027-production -- audio/routing/record-027.json audio/production/record-027 audio/assets/record-027-quote-locked-v2.mp3
          rm -f audio/production/record-027/.DS_Store
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          expected_source='7c297a17bfd383558e5584c3ede01e4f39653d58276c27103715ddd9fa692519'; expected_audio='5098ee985cba523c341de1b18aa703e39d4d57d9659035793bf7104ad33ee6dd'
          assert hashlib.sha256(Path('manuscript/records/027/current.md').read_bytes()).hexdigest()==expected_source
          a=Path('audio/assets/record-027-quote-locked-v2.mp3'); assert hashlib.sha256(a.read_bytes()).hexdigest()==expected_audio
          v=Path('audio/production/record-027/verification-v2.json'); d=json.loads(v.read_text()); assert d['source_sha256']==expected_source and d['sha256']==expected_audio and d['segment_count']==31 and d['duration_seconds']==815.4; d['status']='published_unlistened'; v.write_text(json.dumps(d,indent=2)+'\n')
          m=Path('audio/manifest.json'); x=json.loads(m.read_text()); assert 'r027' not in x['records']; x['records']['r027']={'status':'published','src':'audio/assets/record-027-quote-locked-v2.mp3','source_sha256':expected_source,'audio_sha256':expected_audio,'duration_seconds':815.4,'routing_mode':'exact_quote_locked','listened':False}; m.write_text(json.dumps(x,indent=2)+'\n')
          PY
          python scripts/check_repo.py
          python -m unittest discover -v
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audio
          git commit -m 'Publish Record 027 audio'
          git push origin HEAD:audio/record-027-release
