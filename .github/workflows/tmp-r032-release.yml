name: Temporary Record 032 Clean Release

on:
  push:
    branches: [audio/record-032-release]
    paths:
      - .github/workflows/tmp-r032-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/record-032-release
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import verified Record 032 production artifacts
        run: |
          set -euo pipefail
          git fetch origin audio/record-032-production
          git checkout origin/audio/record-032-production -- \
            audio/assets/record-032-quote-locked-v2.mp3 \
            audio/production/record-032 \
            audio/routing/record-032.json
      - name: Advance audio manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest_path=Path('audio/manifest.json')
          verification_path=Path('audio/production/record-032/verification-v2.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          verification=json.loads(verification_path.read_text(encoding='utf-8'))
          assert verification['record']=='032'
          assert verification['status']=='assembled_unlistened'
          assert verification['segment_count']==29
          assert verification['ithar_segment_indices']==[]
          manifest['records']['r032']={
              'status':'published',
              'src':verification['asset'],
              'source_sha256':verification['source_sha256'],
              'audio_sha256':verification['sha256'],
              'duration_seconds':verification['duration_seconds'],
              'routing_mode':verification['routing_mode'],
              'listened':False,
          }
          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(manifest['records']['r032'],indent=2))
          PY
      - name: Verify clean release contract
        run: |
          python scripts/check_repo.py
          python -m unittest discover -v
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('audio/production/record-032/verification-v2.json').read_text())
          m=json.loads(Path('audio/manifest.json').read_text())['records']['r032']
          assert m['status']=='published'
          assert m['src']==v['asset']=='audio/assets/record-032-quote-locked-v2.mp3'
          assert m['source_sha256']==v['source_sha256']=='fc49b8b8db6da4df9b8a9bd86e00a7886268457155a701ab47cbd5c16d5ba26a'
          assert m['audio_sha256']==v['sha256']=='087e05a64be1de0b4d172d8d4e11317b984d63d16ef46d4c454d88f9c0fe2005'
          assert m['duration_seconds']==v['duration_seconds']==774.624
          assert m['routing_mode']=='exact_quote_locked'
          assert m['listened'] is False
          assert v['ithar_segment_indices']==[]
          print('Record 032 clean release verification passed')
          PY
      - name: Commit clean release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            audio/assets/record-032-quote-locked-v2.mp3 \
            audio/production/record-032 \
            audio/routing/record-032.json \
            audio/manifest.json
          if git diff --cached --quiet; then
            echo "No clean release changes"
          else
            git commit -m "Stage Record 032 audio release"
            git push origin HEAD:audio/record-032-release
          fi
