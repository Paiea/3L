name: Temporary prepare audio 022

on:
  push:
    branches: [audio/capture-022]
    paths:
      - audio/routing/record-022.json
      - manuscript/records/022/current.md
      - scripts/audio_route.py
      - tests/test_audio_routing.py
      - .github/workflows/tmp-prepare-audio-022.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/capture-022
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate audio routing tests
        run: python -m unittest tests.test_audio_routing -v
      - name: Generate route plan and work orders
        run: |
          python scripts/audio_route.py manuscript/records/022/current.md audio/routing/record-022.json audio/production/record-022/route-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          route_path = Path('audio/production/record-022/route-plan.json')
          route = json.loads(route_path.read_text(encoding='utf-8'))
          out_dir = route_path.parent / 'work-orders'
          out_dir.mkdir(parents=True, exist_ok=True)
          segments = route['segments']
          for start in range(0, len(segments), 10):
              batch = segments[start:start+10]
              out = {
                  'record': route['record'],
                  'source_sha256': route['source_sha256'],
                  'routing_mode': route['routing_mode'],
                  'segments': batch,
              }
              first = batch[0]['index']
              last = batch[-1]['index']
              (out_dir / f'segments-{first:03d}-{last:03d}.json').write_text(
                  json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
              )
          print(f"materialized {len(segments)} segments in {(len(segments)+9)//10} work orders")
          PY
      - name: Commit generated capture inputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/production/record-022/route-plan.json audio/production/record-022/work-orders
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "audio: prepare Record 022 capture inputs"
            git push origin HEAD:audio/capture-022
          fi
