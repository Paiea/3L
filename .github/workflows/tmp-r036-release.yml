name: Temporary Record 036 Release

on:
  push:
    branches: [audio/record-036-release]
    paths:
      - .github/workflows/tmp-r036-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/record-036-release
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import verified Record 036 production
        run: |
          set -euo pipefail
          git fetch --depth=1 origin audio/record-036-production
          git checkout FETCH_HEAD -- audio/routing/record-036.json audio/production/record-036 audio/assets/record-036-quote-locked-v2.mp3
          test -f audio/production/record-036/verification-v2.json
          test -f audio/production/record-036/captures.json
          test -f audio/assets/record-036-quote-locked-v2.mp3
      - name: Advance manifest only after verification
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          source_hash='6a69a0b1f513788fc7140a3b5424a2c5291b744ca6f04c0ae937777bc44d95aa'
          audio_hash='368c11c4914b155abe8f9633ccd41fb506fa8e82ea8b4a228741938e3fab6f5c'
          duration=1049.088
          source=Path('manuscript/records/036/current.md').read_text(encoding='utf-8')
          assert hashlib.sha256(source.encode('utf-8')).hexdigest()==source_hash
          asset=Path('audio/assets/record-036-quote-locked-v2.mp3')
          assert hashlib.sha256(asset.read_bytes()).hexdigest()==audio_hash
          verification=json.loads(Path('audio/production/record-036/verification-v2.json').read_text(encoding='utf-8'))
          assert verification['record']=='036'
          assert verification['status']=='assembled_unlistened'
          assert verification['routing_mode']=='exact_quote_locked'
          assert verification['uses_timestamps_for_speaker_assignment'] is False
          assert verification['source_sha256']==source_hash
          assert verification['segment_count']==102
          assert len(verification['ithar_segment_indices'])==37
          assert verification['duration_seconds']==duration
          assert verification['sha256']==audio_hash
          manifest_path=Path('audio/manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['records']['r035']['status']=='published'
          manifest['records']['r036']={
            'status':'published',
            'src':'audio/assets/record-036-quote-locked-v2.mp3',
            'source_sha256':source_hash,
            'audio_sha256':audio_hash,
            'duration_seconds':duration,
            'routing_mode':'exact_quote_locked',
            'listened':False,
          }
          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('Staged Record 036 manifest advancement')
          PY
      - name: Validate clean release
        run: |
          set -euo pipefail
          python scripts/audio_route.py manuscript/records/036/current.md audio/routing/record-036.json /tmp/route-036-release.json
          python - <<'PY'
          import json
          from pathlib import Path
          route=json.loads(Path('/tmp/route-036-release.json').read_text(encoding='utf-8'))
          prepared=json.loads(Path('audio/production/record-036/route-plan.json').read_text(encoding='utf-8'))
          assert route==prepared
          assert ''.join(s['transcript'] for s in route['segments'])==route['audio_body']
          assert [s['index'] for s in route['segments']]==list(range(1,103))
          assert sum(s['speaker']=='ithar' for s in route['segments'])==37
          PY
          python scripts/check_repo.py
          python -m unittest discover -v
      - name: Commit staged Record 036 release
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audio/manifest.json audio/routing/record-036.json audio/production/record-036 audio/assets/record-036-quote-locked-v2.mp3
          git commit -m 'Publish Record 036 production audio'
          git push origin HEAD:audio/record-036-release
