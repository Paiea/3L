name: Temporary assemble audio 022

on:
  push:
    branches: [audio/capture-022]
    paths:
      - audio/production/record-022/captures.json
      - audio/production/record-022/route-plan.json
      - .github/workflows/tmp-assemble-audio-022.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/capture-022
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verify and assemble candidate
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, urllib.request
          from pathlib import Path
          source = Path('manuscript/records/022/current.md')
          prod = Path('audio/production/record-022')
          route = json.loads((prod/'route-plan.json').read_text(encoding='utf-8'))
          captures = json.loads((prod/'captures.json').read_text(encoding='utf-8'))
          source_hash = hashlib.sha256(source.read_bytes()).hexdigest()
          assert source_hash == route['source_sha256'] == captures['source_sha256']
          assert len(route['segments']) == len(captures['segments']) == 42
          for r,c in zip(route['segments'], captures['segments']):
              assert r['index'] == c['index']
              assert int(r['pause_after_ms']) == int(c['pause_after_ms'])
          work = Path('/tmp/record-022')
          work.mkdir(parents=True, exist_ok=True)
          concat=[]
          for item in captures['segments']:
              i=item['index']
              mp3=work/f'{i:03d}.mp3'
              wav=work/f'{i:03d}.wav'
              urllib.request.urlretrieve(item['preview_url'], mp3)
              subprocess.run(['ffmpeg','-y','-loglevel','error','-i',str(mp3),'-ar','24000','-ac','1','-c:a','pcm_s16le',str(wav)],check=True)
              concat.append(wav)
              ms=int(item['pause_after_ms'])
              if ms:
                  silence=work/f'{i:03d}-silence.wav'
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-f','lavfi','-i','anullsrc=r=24000:cl=mono','-t',f'{ms/1000:.3f}','-c:a','pcm_s16le',str(silence)],check=True)
                  concat.append(silence)
          list_file=work/'concat.txt'
          list_file.write_text(''.join(f"file '{p}'\n" for p in concat), encoding='utf-8')
          asset=Path('audio/assets/record-022-quote-locked-v2.mp3')
          asset.parent.mkdir(parents=True, exist_ok=True)
          subprocess.run(['ffmpeg','-y','-loglevel','error','-f','concat','-safe','0','-i',str(list_file),'-c:a','libmp3lame','-b:a','128k',str(asset)],check=True)
          duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(asset)],text=True).strip())
          digest=hashlib.sha256(asset.read_bytes()).hexdigest()
          verification={
              'record':'022',
              'status':'assembled_unlistened',
              'routing_mode':'exact_quote_locked',
              'uses_timestamps_for_speaker_assignment':False,
              'source_sha256':source_hash,
              'segment_count':42,
              'ithar_segment_indices':[35,37,39,41],
              'duration_seconds':round(duration,3),
              'sha256':digest,
              'asset':str(asset),
              'note':'Deterministically assembled from structurally verified candidate takes; auditory listen-back and public release remain pending.'
          }
          (prod/'verification.json').write_text(json.dumps(verification,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(verification,indent=2))
          PY
      - name: Commit assembled candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/assets/record-022-quote-locked-v2.mp3 audio/production/record-022/verification.json
          git commit -m "audio: assemble Record 022 candidate"
          git push origin HEAD:audio/capture-022
