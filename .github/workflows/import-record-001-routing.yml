name: Import Record 001 exact routing

on:
  push:
    branches: [setup/ai-first-reader]
    paths: [.github/workflows/import-record-001-routing.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: setup/ai-first-reader
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact Ithar locks from current manuscript labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.audio_route import manuscript_body, quoted_spans, build_plan

          # One-time human/AI scene labeling against the CURRENT manuscript.
          # These are quote ordinals, not audio timecodes. They are used only
          # to generate the durable exact-text + occurrence locks below.
          ithar_quote_ordinals = [
              1,2,3,5,7,8,9,10,11,13,15,17,18,20,22,24,28,32,35,37,
              42,43,57,62,66,67,74,77,78,79,83,97,100,101,103,104,106,107
          ]

          source_path = Path('manuscript/records/001/current.md')
          source = source_path.read_text(encoding='utf-8')
          quotes = [q for _,_,q in quoted_spans(manuscript_body(source))]
          if len(quotes) != 108:
              raise SystemExit(f'expected 108 quoted spans in current Record 001, found {len(quotes)}')

          locks=[]
          for ordinal in ithar_quote_ordinals:
              text=quotes[ordinal-1]
              occurrence=quotes[:ordinal].count(text)
              locks.append({'text': text, 'occurrence': occurrence})

          config={
              'record':'001',
              'routing_mode':'exact_quote_locked',
              'voices':{'greg':'deep','ithar':'normal'},
              'max_chars':480,
              'pause_ms':{
                  'continuation':220,
                  'paragraph':450,
                  'action':700,
                  'speaker_handoff':1100,
                  'major_beat':1400
              },
              'source_labeling':{
                  'method':'current_manuscript_quote_ordinals_to_exact_locks',
                  'quoted_span_count':len(quotes),
                  'ithar_span_count':len(locks),
                  'uses_audio_timestamps':False
              },
              'dragon_quotes':locks
          }
          out=Path('audio/routing/record-001.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(config, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')

          plan=build_plan(source, config)
          selected=[]
          for ordinal in ithar_quote_ordinals:
              selected.append(quotes[ordinal-1])
          ithar=''.join(s['transcript'] for s in plan['segments'] if s['speaker']=='ithar')
          if ithar != ''.join(selected):
              raise SystemExit('routed Ithar text differs from selected current-manuscript quote spans')
          print(f'locked {len(locks)} Ithar spans from {len(quotes)} current manuscript quotes')
          print('no audio timestamps used')
          PY
          python -m unittest tests.test_audio_routing -v
      - name: Commit exact routing config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/routing/record-001.json
          git commit -m "audio: lock Record 001 routing to exact quotes"
          git pull --rebase origin setup/ai-first-reader
          git push origin HEAD:setup/ai-first-reader
