name: Temporary release audio 021-022

on:
  push:
    branches: [release/audio-021-022]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/audio-021-022
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import verified production artifacts
        run: |
          set -euo pipefail
          mkdir -p audio/assets audio/routing audio/production/record-021 audio/production/record-022/work-orders
          curl -fL https://raw.githubusercontent.com/Paiea/3L/release/audio-021-v2/audio/assets/record-021-quote-locked-v2.mp3 -o audio/assets/record-021-quote-locked-v2.mp3
          curl -fL https://raw.githubusercontent.com/Paiea/3L/release/audio-021-v2/audio/production/record-021/captures.json -o audio/production/record-021/captures.json
          curl -fL https://raw.githubusercontent.com/Paiea/3L/release/audio-021-v2/audio/production/record-021/route-plan.json -o audio/production/record-021/route-plan.json
          curl -fL https://raw.githubusercontent.com/Paiea/3L/release/audio-021-v2/audio/production/record-021/verification-v2.json -o audio/production/record-021/verification-v2.json
          curl -fL https://raw.githubusercontent.com/Paiea/3L/release/audio-021-v2/audio/routing/record-021.json -o audio/routing/record-021.json
          curl -fL https://raw.githubusercontent.com/Paiea/3L/audio/capture-022/audio/assets/record-022-quote-locked-v2.mp3 -o audio/assets/record-022-quote-locked-v2.mp3
          curl -fL https://raw.githubusercontent.com/Paiea/3L/audio/capture-022/audio/production/record-022/captures.json -o audio/production/record-022/captures.json
          curl -fL https://raw.githubusercontent.com/Paiea/3L/audio/capture-022/audio/production/record-022/route-plan.json -o audio/production/record-022/route-plan.json
          curl -fL https://raw.githubusercontent.com/Paiea/3L/audio/capture-022/audio/production/record-022/verification.json -o audio/production/record-022/verification.json
          for f in segments-001-010.json segments-011-020.json segments-021-030.json segments-031-040.json segments-041-042.json; do
            curl -fL "https://raw.githubusercontent.com/Paiea/3L/audio/capture-022/audio/production/record-022/work-orders/$f" -o "audio/production/record-022/work-orders/$f"
          done
          curl -fL https://raw.githubusercontent.com/Paiea/3L/audio/capture-022/audio/routing/record-022.json -o audio/routing/record-022.json
          curl -fL https://raw.githubusercontent.com/Paiea/3L/audio/capture-022/scripts/audio_route.py -o scripts/audio_route.py
          curl -fL https://raw.githubusercontent.com/Paiea/3L/audio/capture-022/tests/test_audio_routing.py -o tests/test_audio_routing.py
      - name: Reconcile manifests and publication frontier
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          mm_path = root/'manuscript/manifest.json'
          mm = json.loads(mm_path.read_text(encoding='utf-8'))
          def count_words(text):
              return sum(1 for token in text.split() if token != '##')
          restored = []
          for rec in mm['records']:
              slot = rec['slot']
              current = root/rec['path']
              original = root/f'manuscript/records/{slot}/versions/original-run.md'
              if current.exists() and original.exists() and current.read_bytes() != original.read_bytes() and rec['prose_status'] == 'needs_rehearsal':
                  rec['prose_status'] = 'restored'
                  rec['word_count'] = count_words(current.read_text(encoding='utf-8'))
                  restored.append((slot, rec['word_count']))
              rec['published'] = int(slot) <= 22
          known = {r['slot']: r['word_count'] for r in mm['records']}
          assert known['021'] == 2429, known['021']
          assert known['022'] == 2597, known['022']
          mm_path.write_text(json.dumps(mm, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          print('reconciled', restored)
          am_path = root/'audio/manifest.json'
          am = json.loads(am_path.read_text(encoding='utf-8'))
          v21 = json.loads((root/'audio/production/record-021/verification-v2.json').read_text())
          v22_path = root/'audio/production/record-022/verification.json'
          v22 = json.loads(v22_path.read_text())
          v22['status'] = 'published_unlistened'
          v22['note'] = 'Published by explicit user continuation request; deterministic route/pause verification passed; auditory listen-back remains pending.'
          v22_path.write_text(json.dumps(v22, indent=2)+'\n')
          for slot, v in [('021', v21), ('022', v22)]:
              source = root/f'manuscript/records/{slot}/current.md'
              source_hash = hashlib.sha256(source.read_bytes()).hexdigest()
              asset = root/v['asset']
              asset_hash = hashlib.sha256(asset.read_bytes()).hexdigest()
              assert source_hash == v['source_sha256']
              assert asset_hash == v['sha256']
              am['records'][f'r{slot}'] = {'status':'published','src':v['asset'],'source_sha256':source_hash,'audio_sha256':asset_hash,'duration_seconds':v['duration_seconds'],'routing_mode':'exact_quote_locked','listened':False}
          am_path.write_text(json.dumps(am, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          test_path = root/'tests/test_repo_contract.py'
          test = test_path.read_text(encoding='utf-8')
          test = test.replace('records[:20]))', 'records[:22]))').replace('records[20:]))', 'records[22:]))').replace('for i in range(1, 21)))', 'for i in range(1, 23)))')
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Verify full repository contract
        run: |
          python scripts/check_repo.py
          python -m unittest discover -v
      - name: Commit clean release files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/assets/record-021-quote-locked-v2.mp3 audio/assets/record-022-quote-locked-v2.mp3 audio/manifest.json audio/routing/record-021.json audio/routing/record-022.json audio/production/record-021 audio/production/record-022 manuscript/manifest.json scripts/audio_route.py tests/test_audio_routing.py tests/test_repo_contract.py
          git commit -m "audio: publish Records 021 and 022"
          git push origin HEAD:release/audio-021-022
