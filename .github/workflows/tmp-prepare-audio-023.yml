name: Temporary prepare audio 023

on:
  push:
    branches: [audio/capture-023]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/capture-023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exact route and work orders
        run: |
          set -euo pipefail
          mkdir -p audio/production/record-023/work-orders
          python scripts/audio_route.py manuscript/records/023/current.md audio/routing/record-023.json audio/production/record-023/route-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('audio/production/record-023/route-plan.json')
          plan = json.loads(p.read_text(encoding='utf-8'))
          segs = plan['segments']
          out = p.parent/'work-orders'
          for i in range(0, len(segs), 10):
              chunk = segs[i:i+10]
              a, b = chunk[0]['index'], chunk[-1]['index']
              data = {
                  'record': '023',
                  'source_sha256': plan['source_sha256'],
                  'routing_mode': plan['routing_mode'],
                  'segments': chunk,
              }
              (out/f'segments-{a:03d}-{b:03d}.json').write_text(json.dumps(data, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          assert all(s['speaker'] == 'greg' and s['voice_id'] == 'deep' for s in segs)
          print('source_sha256', plan['source_sha256'])
          print('segment_count', len(segs))
          print('all_greg_deep', True)
          PY
      - name: Verify prepared routing
        run: |
          python -m unittest tests.test_audio_routing -v
      - name: Commit prepared route
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/production/record-023
          git commit -m "audio: prepare Record 023 capture route"
          git push origin HEAD:audio/capture-023
