name: Build Record 002 route plan

on:
  push:
    branches: [setup/ai-first-reader]
    paths: [.github/workflows/build-record-002-route.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: setup/ai-first-reader
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exact routing plan
        run: |
          python scripts/audio_route.py \
            manuscript/records/002/current.md \
            audio/routing/record-002.json \
            audio/production/record-002/route-plan.json
          python -m unittest tests.test_audio_routing -v
      - name: Commit plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/production/record-002/route-plan.json
          git commit -m "audio: build quote-locked Record 002 route plan"
          git push origin HEAD:setup/ai-first-reader
