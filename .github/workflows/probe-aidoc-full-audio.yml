name: Probe full audio asset

on:
  push:
    branches: [setup/ai-first-reader]
    paths: [.github/workflows/probe-aidoc-full-audio.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect actual audio page chunk
        run: |
          set -euo pipefail
          url='https://www.aidocmaker.com/_next/static/chunks/0jvdr44ux_p72.js'
          curl -L --fail --show-error "$url" -o /tmp/audio-page.js
          file /tmp/audio-page.js
          wc -c /tmp/audio-page.js
          echo '--- API / resolver hints ---'
          grep -aoE '.{0,220}(fetch\(|axios|/api/|audio|name=|download|storage|googleapis|blob|context|query).{0,420}' /tmp/audio-page.js | head -160 || true
