name: Probe full audio asset

on:
  push:
    branches: [setup/ai-first-reader]
    paths: [.github/workflows/probe-aidoc-full-audio.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Identify audio page scripts
        run: |
          set -euo pipefail
          curl -L --fail --show-error \
            'https://www.aidocmaker.com/g0/audio?name=f5212c5e404c4e18abbf6ecb69eaea8c' \
            -o /tmp/page
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/page').read_text(errors='replace')
          for src in re.findall(r'<script[^>]+src="([^"]+)"', s):
              print(src)
          PY
