name: Probe full audio asset

on:
  push:
    branches: [setup/ai-first-reader]
    paths: [.github/workflows/probe-aidoc-full-audio.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect full audio page
        run: |
          set -euo pipefail
          url='https://www.aidocmaker.com/g0/audio?name=f5212c5e404c4e18abbf6ecb69eaea8c'
          curl -L --fail --show-error "$url" -o /tmp/page
          echo '--- context id matches ---'
          grep -Eo '.{0,180}f5212c5e404c4e18abbf6ecb69eaea8c.{0,300}' /tmp/page | head -10 || true
          echo '--- likely audio/api metadata ---'
          grep -Eo '.{0,160}(audioUrl|audio_url|downloadUrl|download_url|googleapis|storage|/api/|g0/audio|\.mp3).{0,320}' /tmp/page | head -40 || true
          echo '--- next data ---'
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/page').read_text(errors='replace')
          for pat in [r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', r'self\.__next_f\.push\((.*?)\)</script>']:
              m=re.search(pat,s)
              if m:
                  print(m.group(1)[:8000])
          PY
