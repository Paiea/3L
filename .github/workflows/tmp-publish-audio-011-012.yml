name: Temporary publish audio 011-012

on:
  push:
    branches: [release/audio-011-012]
    paths:
      - .github/workflows/tmp-publish-audio-011-012.yml
      - audio/production/record-011/captures.json
      - audio/production/record-012/captures.json

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/audio-011-012
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Assemble and stage public release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess, urllib.request
          from pathlib import Path

          root = Path('.')
          records = ['011', '012']
          audio_manifest_path = root / 'audio/manifest.json'
          manuscript_manifest_path = root / 'manuscript/manifest.json'
          audio_manifest = json.loads(audio_manifest_path.read_text(encoding='utf-8'))
          manuscript_manifest = json.loads(manuscript_manifest_path.read_text(encoding='utf-8'))
          audio_manifest.setdefault('records', {})

          for record in records:
              prod = root / f'audio/production/record-{record}'
              prod.mkdir(parents=True, exist_ok=True)
              source_path = root / f'manuscript/records/{record}/current.md'
              routing_path = root / f'audio/routing/record-{record}.json'
              route_path = prod / 'route-plan.json'
              subprocess.run([
                  'python', 'scripts/audio_route.py',
                  str(source_path), str(routing_path), str(route_path)
              ], check=True)

              captures = json.loads((prod / 'captures.json').read_text(encoding='utf-8'))
              plan = json.loads(route_path.read_text(encoding='utf-8'))
              source_hash = hashlib.sha256(source_path.read_bytes()).hexdigest()

              assert plan['record'] == record
              assert plan['routing_mode'] == 'exact_quote_locked'
              assert plan.get('uses_timestamps_for_speaker_assignment') is False
              assert plan['source_sha256'] == source_hash, f'{record}: route plan stale'
              assert captures['source_sha256'] == source_hash, f'{record}: captures stale'
              assert captures['routing_mode'] == 'exact_quote_locked'
              assert captures['status'] == 'candidate_unlistened'
              assert ''.join(s['transcript'] for s in plan['segments']) == plan['audio_body']
              assert len(plan['segments']) == len(captures['segments'])

              for routed, captured in zip(plan['segments'], captures['segments']):
                  assert routed['index'] == captured['index'], f'{record}: index mismatch'
                  assert int(routed['pause_after_ms']) == int(captured['pause_after_ms']), f'{record}: pause mismatch'
                  if routed['speaker'] == 'greg':
                      assert routed['voice_id'] == 'deep'
                  elif routed['speaker'] == 'ithar':
                      assert routed['voice_id'] == 'normal'
                  else:
                      raise AssertionError(f'{record}: unknown speaker {routed["speaker"]}')

              work = Path(f'/tmp/record-{record}-v2')
              work.mkdir(parents=True, exist_ok=True)
              concat = []
              for item in captures['segments']:
                  i = item['index']
                  mp3 = work / f'{i:03d}.mp3'
                  wav = work / f'{i:03d}.wav'
                  urllib.request.urlretrieve(item['preview_url'], mp3)
                  subprocess.run([
                      'ffmpeg', '-y', '-loglevel', 'error', '-i', str(mp3),
                      '-ar', '24000', '-ac', '1', '-c:a', 'pcm_s16le', str(wav)
                  ], check=True)
                  concat.append(wav)
                  ms = int(item['pause_after_ms'])
                  if ms:
                      silence = work / f'{i:03d}-silence.wav'
                      subprocess.run([
                          'ffmpeg', '-y', '-loglevel', 'error', '-f', 'lavfi',
                          '-i', 'anullsrc=r=24000:cl=mono', '-t', f'{ms/1000:.3f}',
                          '-c:a', 'pcm_s16le', str(silence)
                      ], check=True)
                      concat.append(silence)

              list_file = work / 'concat.txt'
              list_file.write_text(''.join(f"file '{p}'\n" for p in concat), encoding='utf-8')
              asset = f'audio/assets/record-{record}-quote-locked-v2.mp3'
              out = root / asset
              out.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run([
                  'ffmpeg', '-y', '-loglevel', 'error', '-f', 'concat', '-safe', '0',
                  '-i', str(list_file), '-c:a', 'libmp3lame', '-b:a', '128k', str(out)
              ], check=True)
              duration = float(subprocess.check_output([
                  'ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                  '-of', 'default=noprint_wrappers=1:nokey=1', str(out)
              ], text=True).strip())
              digest = hashlib.sha256(out.read_bytes()).hexdigest()

              verification = {
                  'record': record,
                  'status': 'published_unlistened',
                  'routing_mode': 'exact_quote_locked',
                  'uses_timestamps_for_speaker_assignment': False,
                  'source_sha256': source_hash,
                  'segment_count': len(captures['segments']),
                  'duration_seconds': round(duration, 3),
                  'sha256': digest,
                  'asset': asset,
                  'note': 'Published by explicit user request; deterministic route/pause verification passed; auditory listen-back remains pending.'
              }
              (prod / 'verification-v2.json').write_text(json.dumps(verification, indent=2) + '\n', encoding='utf-8')
              audio_manifest['records'][f'r{record}'] = {
                  'status': 'published',
                  'src': asset,
                  'source_sha256': source_hash,
                  'audio_sha256': digest,
                  'duration_seconds': round(duration, 3),
                  'routing_mode': 'exact_quote_locked',
                  'listened': False
              }
              print(json.dumps(verification, indent=2))

          for rec in manuscript_manifest['records']:
              if rec['id'] in {'r011', 'r012'}:
                  rec['published'] = True

          audio_manifest_path.write_text(json.dumps(audio_manifest, indent=2) + '\n', encoding='utf-8')
          manuscript_manifest_path.write_text(json.dumps(manuscript_manifest, indent=2) + '\n', encoding='utf-8')

          test_path = root / 'tests/test_repo_contract.py'
          text = test_path.read_text(encoding='utf-8')
          text = text.replace(
              'self.assertTrue(all(r["published"] for r in records[:10]))',
              'self.assertTrue(all(r["published"] for r in records[:12]))'
          )
          text = text.replace(
              'self.assertTrue(all(not r["published"] for r in records[10:]))',
              'self.assertTrue(all(not r["published"] for r in records[12:]))'
          )
          text = text.replace(
              'self.assertTrue(all(audio["records"][f"r{i:03d}"]["status"] == "published" for i in range(1, 11)))',
              'self.assertTrue(all(audio["records"][f"r{i:03d}"]["status"] == "published" for i in range(1, 13)))'
          )
          test_path.write_text(text, encoding='utf-8')
          PY
          python -m unittest -v
          python scripts/check_repo.py
      - name: Commit release assets and manifests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            audio/assets/record-011-quote-locked-v2.mp3 \
            audio/assets/record-012-quote-locked-v2.mp3 \
            audio/production/record-011/captures.json \
            audio/production/record-011/route-plan.json \
            audio/production/record-011/verification-v2.json \
            audio/production/record-012/captures.json \
            audio/production/record-012/route-plan.json \
            audio/production/record-012/verification-v2.json \
            audio/manifest.json \
            manuscript/manifest.json \
            tests/test_repo_contract.py
          git commit -m "Publish Records 011-012 with audio"
          git push origin HEAD:release/audio-011-012
