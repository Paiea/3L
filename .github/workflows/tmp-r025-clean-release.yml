name: Temporary Record 025 Clean Release

on:
  push:
    branches: [audio/record-025-release]
    paths:
      - .github/workflows/tmp-r025-clean-release.yml

permissions:
  contents: write

jobs:
  stage-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/record-025-release
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import finished Record 025 artifacts only
        run: |
          set -euo pipefail
          git fetch origin audio/record-025-production
          git checkout origin/audio/record-025-production -- \
            audio/routing/record-025.json \
            audio/production/record-025/route-plan.json \
            audio/production/record-025/work-orders \
            audio/production/record-025/captures.json \
            audio/production/record-025/verification-v2.json \
            audio/assets/record-025-quote-locked-v2.mp3
      - name: Reconcile against clean latest-main manuscript
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          source=Path('manuscript/records/025/current.md')
          route=Path('audio/production/record-025/route-plan.json')
          verify=Path('audio/production/record-025/verification-v2.json')
          audio=Path('audio/assets/record-025-quote-locked-v2.mp3')
          audio_manifest=Path('audio/manifest.json')
          manuscript_manifest=Path('manuscript/manifest.json')

          r=json.loads(route.read_text(encoding='utf-8'))
          v=json.loads(verify.read_text(encoding='utf-8'))
          src_sha=hashlib.sha256(source.read_bytes()).hexdigest()
          audio_sha=hashlib.sha256(audio.read_bytes()).hexdigest()
          assert src_sha == r['source_sha256'] == v['source_sha256'] == '3a5b233cb1b4c8544e5539b28c5a35a8648b00710a8cbb2354a30461923d3681'
          assert audio_sha == v['sha256'] == '33a15360e6cf87dc9c5141240a727391aa3d4adbab858c8e3de0ed2a8ed81da5'
          assert len(r['segments']) == v['segment_count'] == 29
          assert all(s['speaker']=='greg' and s['voice_id']=='deep' for s in r['segments'])
          assert v['ithar_segment_indices']==[]

          mm=json.loads(manuscript_manifest.read_text(encoding='utf-8'))
          entry=next(x for x in mm['records'] if x['id']=='r025')
          assert entry['slot']=='025' and entry['title']=='THE CONFESSOR'
          assert entry['published'] is True and entry['prose_status']=='restored'

          am=json.loads(audio_manifest.read_text(encoding='utf-8'))
          am['records']['r025']={
            'status':'published',
            'src':'audio/assets/record-025-quote-locked-v2.mp3',
            'source_sha256':src_sha,
            'audio_sha256':audio_sha,
            'duration_seconds':v['duration_seconds'],
            'routing_mode':'exact_quote_locked',
            'listened':False
          }
          audio_manifest.write_text(json.dumps(am,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          v['status']='published_unlistened'
          v['note']='Published from a clean release based on latest main; deterministic route/pause verification passed; auditory listen-back remains pending.'
          verify.write_text(json.dumps(v,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('clean release reconciliation passed')
          print('source_sha256',src_sha)
          print('audio_sha256',audio_sha)
          print('duration_seconds',v['duration_seconds'])
          PY
      - name: Verify repository contract
        run: |
          git diff --check
          python scripts/check_repo.py
          python -m unittest discover -v
      - name: Commit clean Record 025 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/routing/record-025.json audio/production/record-025 audio/assets/record-025-quote-locked-v2.mp3 audio/manifest.json
          git commit -m "Publish Record 025 audio"
          git push origin HEAD:audio/record-025-release
