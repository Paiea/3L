name: Temporary Record 024 Clean Release

on:
  push:
    branches: [audio/record-024-release]
    paths:
      - .github/workflows/tmp-r024-clean-release.yml

permissions:
  contents: write

jobs:
  stage-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/record-024-release
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import finished Record 024 artifacts only
        run: |
          set -euo pipefail
          git fetch origin audio/record-024-production
          git checkout origin/audio/record-024-production -- \
            audio/routing/record-024.json \
            audio/production/record-024/route-plan.json \
            audio/production/record-024/work-orders \
            audio/production/record-024/captures.json \
            audio/production/record-024/verification-v2.json \
            audio/assets/record-024-quote-locked-v2.mp3
      - name: Reconcile against clean latest-main manuscript
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          record='024'
          source=Path('manuscript/records/024/current.md')
          route=Path('audio/production/record-024/route-plan.json')
          verify=Path('audio/production/record-024/verification-v2.json')
          audio=Path('audio/assets/record-024-quote-locked-v2.mp3')
          audio_manifest=Path('audio/manifest.json')
          manuscript_manifest=Path('manuscript/manifest.json')

          r=json.loads(route.read_text(encoding='utf-8'))
          v=json.loads(verify.read_text(encoding='utf-8'))
          src_sha=hashlib.sha256(source.read_bytes()).hexdigest()
          audio_sha=hashlib.sha256(audio.read_bytes()).hexdigest()
          assert src_sha == r['source_sha256'] == v['source_sha256'] == 'c706c3669d031781103ba7000fdedb8a90e0fa64ce4a8ac69a27087f1eff71fd'
          assert audio_sha == v['sha256'] == '84b54eac5f36915734f9491d4e41914d29237ab70fcd64281dbfaadab10f4474'
          assert len(r['segments']) == v['segment_count'] == 42
          assert [s['index'] for s in r['segments'] if s['speaker']=='ithar'] == [35,37,39,41]

          mm=json.loads(manuscript_manifest.read_text(encoding='utf-8'))
          entry=next(x for x in mm['records'] if x['id']=='r024')
          assert entry['slot']=='024' and entry['title']=='THE WRONG MAN'
          assert entry['published'] is True and entry['prose_status']=='restored'

          am=json.loads(audio_manifest.read_text(encoding='utf-8'))
          am['records']['r024']={
            'status':'published',
            'src':'audio/assets/record-024-quote-locked-v2.mp3',
            'source_sha256':src_sha,
            'audio_sha256':audio_sha,
            'duration_seconds':v['duration_seconds'],
            'routing_mode':'exact_quote_locked',
            'listened':False
          }
          audio_manifest.write_text(json.dumps(am,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          v['status']='published_unlistened'
          v['note']='Published from a clean release based on latest main; deterministic route/pause verification passed; auditory listen-back remains pending.'
          verify.write_text(json.dumps(v,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('clean release reconciliation passed')
          print('source_sha256',src_sha)
          print('audio_sha256',audio_sha)
          print('duration_seconds',v['duration_seconds'])
          PY
      - name: Verify repository contract
        run: |
          git diff --check
          python scripts/check_repo.py
          python -m unittest discover -v
      - name: Commit clean Record 024 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/routing/record-024.json audio/production/record-024 audio/assets/record-024-quote-locked-v2.mp3 audio/manifest.json
          git commit -m "Publish Record 024 audio"
          git push origin HEAD:audio/record-024-release
