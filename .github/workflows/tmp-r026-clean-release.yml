name: Temporary Record 026 Clean Release
on:
  push:
    branches: [audio/record-026-release]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/record-026-release
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import only Record 026 production files
        run: |
          git fetch origin audio/record-026-production --depth=1
          git checkout origin/audio/record-026-production -- audio/routing/record-026.json audio/production/record-026 audio/assets/record-026-quote-locked-v2.mp3
      - name: Verify and publish manifest entry
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          source='9744fb68a8bf2720ef1970f419fc90969fb8faabd448c5bc3cab2f699af1b26e'
          audio='8538269f3de0e8a1d04f36f3ccbcda60fa5e09112885414b5d05d04be33cc1ef'
          p=Path('manuscript/records/026/current.md')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==source
          a=Path('audio/assets/record-026-quote-locked-v2.mp3')
          assert hashlib.sha256(a.read_bytes()).hexdigest()==audio
          v=Path('audio/production/record-026/verification-v2.json')
          verification=json.loads(v.read_text())
          assert verification['source_sha256']==source and verification['sha256']==audio
          assert verification['duration_seconds']==692.976 and verification['segment_count']==26
          verification['status']='published_unlistened'
          v.write_text(json.dumps(verification,indent=2)+'\n')
          mm=json.loads(Path('manuscript/manifest.json').read_text())
          r=next(x for x in mm['records'] if x['id']=='r026')
          assert r['prose_status']=='restored' and r['published'] is True
          am=Path('audio/manifest.json')
          data=json.loads(am.read_text())
          assert 'r026' not in data['records']
          data['records']['r026']={
            'status':'published','src':'audio/assets/record-026-quote-locked-v2.mp3',
            'source_sha256':source,'audio_sha256':audio,'duration_seconds':692.976,
            'routing_mode':'exact_quote_locked','listened':False
          }
          am.write_text(json.dumps(data,indent=2)+'\n')
          print('Record 026 clean release verification passed')
          PY
      - name: Repository gates
        run: |
          python scripts/check_repo.py
          python -m unittest discover -v
      - name: Commit clean release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/routing/record-026.json audio/production/record-026 audio/assets/record-026-quote-locked-v2.mp3 audio/manifest.json
          git commit -m "Publish Record 026 audio"
          git push origin HEAD:audio/record-026-release
