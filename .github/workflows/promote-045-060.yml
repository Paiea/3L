name: Promote Records 045-060

on:
  push:
    branches:
      - story/open-circuit-045-actual

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate publication metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          manifest_path = root / 'manuscript' / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          for number in range(45, 61):
              rec = manifest['records'][number - 1]
              prose_path = root / rec['path']
              text = prose_path.read_text(encoding='utf-8')
              lines = text.splitlines()
              title_line = next((line for line in lines if line.startswith('## THE ')), None)
              if not title_line:
                  raise SystemExit(f'No title heading found for record {number:03d}')
              title = title_line.removeprefix('## ').strip()
              body_lines = [line for line in lines if not line.startswith('## RECORD ') and not line.startswith('## THE ')]
              body = '\n'.join(body_lines).strip()
              rec['title'] = title
              rec['prose_status'] = 'restored'
              rec['published'] = True
              rec['word_count'] = len(body.split())

          manifest_path.write_text(json.dumps(manifest, separators=(',', ':')) + '\n', encoding='utf-8')

          test_path = root / 'tests' / 'test_repo_contract.py'
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace('records[:44]', 'records[:60]').replace('records[44:]', 'records[60:]')
          test_path.write_text(test_text, encoding='utf-8')

          current_path = root / 'brain' / 'CURRENT.md'
          current = current_path.read_text(encoding='utf-8')
          current = current.replace(
              '- Public/main prose frontier: Record 044 unless separately promoted.',
              '- Public/main prose frontier: Record 060.'
          )
          current_path.write_text(current, encoding='utf-8')
          PY

      - name: Verify repository contract
        run: |
          python scripts/check_repo.py
          python -m unittest discover -s tests -p 'test_repo_contract.py'

      - name: Commit release metadata and self-remove
        run: |
          rm .github/workflows/promote-045-060.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/manifest.json tests/test_repo_contract.py brain/CURRENT.md .github/workflows/promote-045-060.yml
          git commit -m "publish: records 045-060"
          git push origin HEAD:story/open-circuit-045-actual
