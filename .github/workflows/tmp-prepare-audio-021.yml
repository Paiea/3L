name: Temporary prepare audio 021

on:
  push:
    branches: [audio/capture-021]
    paths:
      - .github/workflows/tmp-prepare-audio-021.yml
      - scripts/tmp_prepare_audio_021.py
      - audio/routing/record-021.json

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/capture-021
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build route and work orders
        run: python scripts/tmp_prepare_audio_021.py
      - name: Validate
        run: python -m unittest -v tests.test_audio_routing
      - name: Commit prep files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/routing/record-021.json audio/production/record-021/route-plan.json audio/production/record-021/work-orders
          git commit -m "Prepare Record 021 audio routing"
          git push origin HEAD:audio/capture-021
