name: Test prepared audio routes

on:
  push:
    branches: [setup/ai-first-reader]
    paths:
      - tests/test_audio_routing.py
      - scripts/audio_route.py
      - audio/routing/**
      - .github/workflows/test-prepared-audio-routes.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_audio_routing -v
