name: Update CURRENT for Records 071-075

on:
  push:
    branches:
      - story/071-075-nhal-anchor

permissions:
  contents: write

jobs:
  update-current:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch hot authority
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('brain/CURRENT.md')
          text = path.read_text(encoding='utf-8')

          text = text.replace('- Public/main prose frontier: Record 060.', '- Public/main prose frontier: Record 070.')
          text = text.replace('- Working-branch restored prose frontier: Record 070.', '- Working-branch restored prose frontier: Record 075.')
          text = text.replace('- Next rehearsal target: Record 071.', '- Next rehearsal target: Record 076.')
          text = text.replace('## First-Life progression through Record 070', '## First-Life progression through Record 075')

          marker = '## Compressed First-Life authority between Records 065 and 068'
          if marker not in text:
              raise SystemExit('compressed-authority marker missing')

          summaries = '''### 071 · THE LOAD
The expedition descends through enormous visible ribs and braces. Greg notices that deep pressure changes begin before the visible ribs flex. The survey lead proves the timing with instruments and correctly frames the structures as possible secondary restraints rather than primary supports. Broken ribs have not collapsed the shaft. Greg's question begins shifting from what is strong enough to hold the place toward what is actually paying for stability.

### 072 · THE ANCHOR
The team maps pressure/load behavior across branching galleries. Local structures accept load only to thresholds, after which additional burden disappears from visible geometry and reappears remotely. Greg suggests mapping transfers rather than supports. The survey team improves that idea into interface mapping. Functioning paths trend inward and downward toward the central shaft. The expedition now has a direction but still no identified primary carrier.

### 073 · THE RELIEF
Pava needs a stronger pressure pulse while forearm/channel return, not mana reserve, is her limiting factor. Greg proposes a narrow established use of Draw/load routing: preserve the instrument's useful pulse and redirect part of the post-action return into the expedition's remaining pressure anchor. Mael requires bench proof and a low live test first. The medium pulse succeeds, Pava's hand opens cleanly, one sacrificial anchor band is spent, and the resulting trace gives a cleaner downward direction. Greg proves why he belongs without gaining command authority; he remains insurance.

### 074 · THE CARRIER
Deeper infrastructure contains not only load paths but blue standing relationships that behave like maintained constraints between distant parts of the system. The lattice shifts load before visible failure, preserves some routes while spending others, and adapts around diagnostic contact. Greg recognizes behavior analogous to high-level support architecture but does not claim intelligence from that alone. Pava and the survey team provide much of the evidence. By the lower throat, whatever carries the system demonstrably notices interference and adjusts around it.

### 075 · THE BOUND ONE
The expedition reaches the convergence chamber and finds an ancient nonhuman body suspended within six major pillars and an immense blue control/load lattice. The figure is alive. The load paths do not merely terminate at the chamber; many maintained relationships run through the bound being. Arcrutus wants immediate rescue, while Mael and Pava insist that altering the connections without understanding their function could destabilize the entire buried system. Greg recognizes the central horror: Nhal is both captive and part of what is carrying the load. His first question is **If we free her, where does it go?** Nhal's eyes open at the end, but she has not spoken yet.

'''
          text = text.replace(marker, summaries + marker, 1)

          start = text.find('## Pressure for Record 071')
          end = text.find('## Prose lock')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('pressure section markers missing')

          pressure = '''## Pressure for Record 076

The expedition has found Nhal alive and bound into the foundational system. Do not turn the next record into an instant exposition dump or simple rescue.

Useful next pressure:
- Nhal has just opened her eyes but has not yet established ordinary conversation;
- remember Ithar already knows in the present frame that Nhal later spoke to Greg, so the interest is how communication became possible and what she revealed technically;
- establish whether Nhal is voluntarily compensating, being forced, or some mixture without reducing the answer to a binary too quickly;
- map which loads/constraints actually depend on Nhal before anyone attempts release;
- let Mael remain operational leader and let Pava/survey/healer expertise matter;
- Greg's specialty gives him a useful language for boundaries and transfer, not automatic authority over Nhal or the ancient system;
- Arcrutus's rescue impulse can create pressure, but he is not stupid and should respond to evidence;
- keep the remaining pressure anchor, spent sacrificial band, route window, sleep, water, and other expedition costs alive;
- do not spend the S-class death casually. The operation has not earned it yet;
- Greg remains A-class. His eventual S proof comes later when the expedition becomes catastrophic and he keeps S-class-scale capability functioning under failure.

'''
          text = text[:start] + pressure + text[end:]
          text = text.replace('Do not write Record 071 without a new bounded approval gate.', 'Do not write Record 076 without a new bounded approval gate.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit authority update and remove temporary workflow
        run: |
          rm .github/workflows/update-current-071-075.yml
          git config user.name "Paiea"
          git config user.email "paiea.tv@gmail.com"
          git add brain/CURRENT.md .github/workflows/update-current-071-075.yml
          git commit -m "story: update authority through Record 075"
          git push origin HEAD:story/071-075-nhal-anchor
