name: Temporary Record 031 Clean Release

on:
  push:
    branches: [audio/record-031-release]
    paths:
      - .github/workflows/tmp-r031-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/record-031-release
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import verified Record 031 production artifacts
        run: |
          set -euo pipefail
          git fetch origin audio/record-031-production
          git checkout origin/audio/record-031-production -- \
            audio/assets/record-031-quote-locked-v2.mp3 \
            audio/production/record-031 \
            audio/routing/record-031.json
      - name: Advance audio manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest_path=Path('audio/manifest.json')
          verification_path=Path('audio/production/record-031/verification-v2.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          verification=json.loads(verification_path.read_text(encoding='utf-8'))
          assert verification['record']=='031'
          assert verification['status']=='assembled_unlistened'
          assert verification['segment_count']==46
          assert verification['ithar_segment_indices']==[35,37,39,41,43,45]
          manifest['records']['r031']={
              'status':'published',
              'src':verification['asset'],
              'source_sha256':verification['source_sha256'],
              'audio_sha256':verification['sha256'],
              'duration_seconds':verification['duration_seconds'],
              'routing_mode':verification['routing_mode'],
              'listened':False,
          }
          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(manifest['records']['r031'],indent=2))
          PY
      - name: Verify clean release contract
        run: |
          python scripts/check_repo.py
          python -m unittest discover -v
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('audio/production/record-031/verification-v2.json').read_text())
          m=json.loads(Path('audio/manifest.json').read_text())['records']['r031']
          assert m['status']=='published'
          assert m['src']==v['asset']=='audio/assets/record-031-quote-locked-v2.mp3'
          assert m['source_sha256']==v['source_sha256']=='e7115e2b46e8ea4ff0bbbed823278cc4e5993356866c2082f31f2fd25a739217'
          assert m['audio_sha256']==v['sha256']=='4cdf4a74b8b066ad723a860d0fbdea7971906299bb5fabadf0b9def890c929c2'
          assert m['duration_seconds']==v['duration_seconds']==965.016
          assert m['routing_mode']=='exact_quote_locked'
          assert m['listened'] is False
          assert v['ithar_segment_indices']==[35,37,39,41,43,45]
          print('Record 031 clean release verification passed')
          PY
      - name: Commit clean release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            audio/assets/record-031-quote-locked-v2.mp3 \
            audio/production/record-031 \
            audio/routing/record-031.json \
            audio/manifest.json
          if git diff --cached --quiet; then
            echo "No clean release changes"
          else
            git commit -m "Stage Record 031 audio release"
            git push origin HEAD:audio/record-031-release
          fi
