name: Temporary Record 030 Clean Release

on:
  push:
    branches: [audio/record-030-release]
    paths:
      - .github/workflows/tmp-r030-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/record-030-release
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import verified Record 030 production artifacts
        run: |
          set -euo pipefail
          git fetch origin audio/record-030-production
          git checkout origin/audio/record-030-production -- \
            audio/assets/record-030-quote-locked-v2.mp3 \
            audio/production/record-030 \
            audio/routing/record-030.json
      - name: Advance audio manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest_path=Path('audio/manifest.json')
          verification_path=Path('audio/production/record-030/verification-v2.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          verification=json.loads(verification_path.read_text(encoding='utf-8'))
          assert verification['record']=='030'
          assert verification['status']=='assembled_unlistened'
          assert verification['segment_count']==34
          assert verification['ithar_segment_indices']==[]
          manifest['records']['r030']={
              'status':'published',
              'src':verification['asset'],
              'source_sha256':verification['source_sha256'],
              'audio_sha256':verification['sha256'],
              'duration_seconds':verification['duration_seconds'],
              'routing_mode':verification['routing_mode'],
              'listened':False,
          }
          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(manifest['records']['r030'],indent=2))
          PY
      - name: Verify clean release contract
        run: |
          python scripts/check_repo.py
          python -m unittest discover -v
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('audio/production/record-030/verification-v2.json').read_text())
          m=json.loads(Path('audio/manifest.json').read_text())['records']['r030']
          assert m['status']=='published'
          assert m['src']==v['asset']=='audio/assets/record-030-quote-locked-v2.mp3'
          assert m['source_sha256']==v['source_sha256']=='2ae119cd7b2ca903e5ddc9c0843cc82fb105dec487d6bc9276fec072ec6d17e3'
          assert m['audio_sha256']==v['sha256']=='6cad45f6718a04e50150f7c7f2ff7238d863ad4aea3f9f63470c73905191f3a6'
          assert m['duration_seconds']==v['duration_seconds']==905.928
          assert m['routing_mode']=='exact_quote_locked'
          assert m['listened'] is False
          print('Record 030 clean release verification passed')
          PY
      - name: Commit clean release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            audio/assets/record-030-quote-locked-v2.mp3 \
            audio/production/record-030 \
            audio/routing/record-030.json \
            audio/manifest.json
          if git diff --cached --quiet; then
            echo "No clean release changes"
          else
            git commit -m "Stage Record 030 audio release"
            git push origin HEAD:audio/record-030-release
          fi
