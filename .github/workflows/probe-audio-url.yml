name: Probe generated audio URL

on:
  push:
    branches: [setup/ai-first-reader]
    paths: [.github/workflows/probe-audio-url.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe full and preview audio
        run: |
          set -euxo pipefail
          curl -L --fail --show-error 'https://www.aidocmaker.com/g0/audio?name=c143f74ba58d48bf981691bd5939c86c' -o /tmp/full.bin
          curl -L --fail --show-error 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/d8776798-ab3d-4559-83db-4adde6c32c00.mp3' -o /tmp/preview.mp3
          file /tmp/full.bin /tmp/preview.mp3
          ls -lh /tmp/full.bin /tmp/preview.mp3
          ffprobe -v error -show_entries format=format_name,duration -of default=noprint_wrappers=1 /tmp/full.bin || true
          ffprobe -v error -show_entries format=format_name,duration -of default=noprint_wrappers=1 /tmp/preview.mp3
