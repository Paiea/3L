<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="3L · The Third Leg — listen and read the record.">
<title>3L · The Third Leg</title>
<style>
:root{color-scheme:light;--paper:#f7f2e8;--ink:#211d18;--muted:#786f63;--line:#d9d0c1;--accent:#734a2f;--panel:#fffaf1;--max:46rem}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.72}.shell{width:min(calc(100% - 2rem),var(--max));margin:auto}.site-head{padding:1rem 0;border-bottom:1px solid var(--line);font-family:ui-sans-serif,system-ui,sans-serif}.site-head .shell{display:flex;justify-content:space-between;gap:1rem;align-items:center}.brand{font-weight:800;letter-spacing:.12em;text-transform:uppercase}.sub{font-size:.82rem;color:var(--muted)}main{padding:3.25rem 0 5rem}.record-head{text-align:center;margin-bottom:2.25rem}.record-no,.badge{font-family:ui-sans-serif,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:.76rem;color:var(--muted)}h1{font-size:clamp(2rem,7vw,3.25rem);line-height:1.05;margin:.35rem 0 .6rem;text-transform:uppercase}.meta{font-family:ui-sans-serif,system-ui,sans-serif;color:var(--muted);font-size:.88rem}.audio{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;margin:0 0 2rem}.audio strong{display:block;font-family:ui-sans-serif,system-ui,sans-serif;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.55rem}.audio audio{width:100%}.prose{font-size:clamp(1.08rem,2.6vw,1.22rem)}.prose p{margin:0 0 1.1em}.prose h2{font-size:1.2rem;margin:2.3rem 0 .7rem}.prose blockquote{margin:1.2rem 0;padding-left:1rem;border-left:3px solid var(--line);color:#4d453c}.nav{display:grid;grid-template-columns:1fr auto 1fr;gap:.7rem;align-items:center;margin:2.5rem 0 0;padding-top:1.25rem;border-top:1px solid var(--line);font-family:ui-sans-serif,system-ui,sans-serif}.nav a,.nav button,.record-select{font:inherit;color:var(--ink);background:transparent;border:0;text-decoration:none;cursor:pointer}.nav .next{text-align:right}.nav .disabled{opacity:.25;pointer-events:none}.record-select{max-width:11rem;border:1px solid var(--line);border-radius:9px;padding:.45rem;background:var(--panel)}.status{font-family:ui-sans-serif,system-ui,sans-serif;background:#efe3cf;border:1px solid #d7c4a7;border-radius:999px;display:inline-block;padding:.28rem .58rem;font-size:.72rem;margin-top:.5rem}.error{background:#fff3ef;border:1px solid #d9aaa0;border-radius:12px;padding:1rem;font-family:ui-sans-serif,system-ui,sans-serif}.toc{margin-top:1.5rem;font-family:ui-sans-serif,system-ui,sans-serif}.toc details{border-top:1px solid var(--line);padding:.8rem 0}.toc summary{cursor:pointer;font-weight:700}.toc-list{display:grid;gap:.3rem;margin-top:.7rem}.toc-list a{text-decoration:none;color:var(--ink);padding:.35rem 0}.toc-list a small{color:var(--muted);margin-left:.5rem}.working-banner{display:none;background:#2d2924;color:#fff4e6;padding:.55rem 1rem;text-align:center;font-family:ui-sans-serif,system-ui,sans-serif;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}.working .working-banner{display:block}@media(max-width:520px){.site-head .sub{display:none}.nav{grid-template-columns:1fr 1fr}.nav .record-select{grid-column:1/-1;grid-row:1;width:100%;max-width:none}.nav .prev{grid-column:1}.nav .next{grid-column:2}main{padding-top:2.4rem}}
</style>
</head>
<body>
<div class="working-banner">Working prose preview · candidate audio may appear here · not public release authority</div>
<header class="site-head"><div class="shell"><div class="brand">3L · The Third Leg</div><div class="sub">Audio first · prose always available</div></div></header>
<main class="shell">
<section id="record" hidden>
<header class="record-head"><div class="record-no" id="recordNo"></div><h1 id="title"></h1><div class="meta" id="meta"></div><div id="statusBadge"></div></header>
<section class="audio" id="audioBox" hidden><strong id="audioLabel">Listen</strong><audio id="player" controls preload="metadata"></audio></section>
<article class="prose" id="prose"></article>
<nav class="nav"><a class="prev" id="prev">← Previous</a><select class="record-select" id="recordSelect" aria-label="Choose record"></select><a class="next" id="next">Next →</a></nav>
</section>
<section id="landing"><header class="record-head"><div class="record-no">A record of two lives</div><h1>The Third Leg</h1><div class="meta">Listen when audio exists. Read the same current story authority underneath it.</div></header><div class="toc"><details open><summary>Records</summary><div class="toc-list" id="tocList"></div></details></div></section>
<div class="error" id="error" hidden></div>
</main>
<script>
(() => {
  const $=id=>document.getElementById(id);
  const params=new URLSearchParams(location.search);
  const working=params.get('work')==='1';
  if(working) document.body.classList.add('working');

  const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function inline(text){
    let s=escapeHtml(text);
    s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/\*([^*]+?)\*/g,'<em>$1</em>');
    return s;
  }
  function renderMarkdown(text){
    const cleaned=text.replace(/\r/g,'').replace(/^##\s+RECORD[^\n]*\n+(?:##\s+[^\n]*\n+)?/i,'');
    return cleaned.split(/\n\s*\n/).map(block=>{
      const b=block.trim(); if(!b) return '';
      if(/^###\s+/.test(b)) return `<h2>${inline(b.replace(/^###\s+/,''))}</h2>`;
      if(/^##\s+/.test(b)) return `<h2>${inline(b.replace(/^##\s+/,''))}</h2>`;
      if(/^>\s*/.test(b)) return `<blockquote>${b.split('\n').map(x=>inline(x.replace(/^>\s?/,''))).join('<br>')}</blockquote>`;
      return `<p>${b.split('\n').map(inline).join('<br>')}</p>`;
    }).join('');
  }
  const fail=msg=>{ $('record').hidden=true;$('landing').hidden=true;$('error').hidden=false;$('error').textContent=msg; };
  const loadJson=path=>fetch(path,{cache:'no-store'}).then(r=>{if(!r.ok) throw new Error(path);return r.json()});

  Promise.all([loadJson('PROJECT.json'),loadJson('manuscript/manifest.json'),loadJson('audio/manifest.json').catch(()=>({records:{}}))])
  .then(async([project,manifest,audio])=>{
    if(!Array.isArray(manifest.records)) throw new Error('Invalid manuscript manifest');
    const visible=working?manifest.records:manifest.records.filter(r=>r.published);
    if(!visible.length) throw new Error('No readable records are published yet');
    const byKey=new Map();
    manifest.records.forEach(r=>{byKey.set(String(r.id).toLowerCase(),r);byKey.set(String(r.slot).toLowerCase(),r);byKey.set(String(Number(r.slot)),r)});
    const requested=params.get('record');
    const current=requested?byKey.get(requested.toLowerCase()):null;

    $('tocList').innerHTML=visible.map(r=>`<a href="?record=${encodeURIComponent(r.slot)}${working?'&work=1':''}"><strong>${escapeHtml(r.display||r.slot)}</strong> ${escapeHtml(r.title)} <small>${escapeHtml(r.prose_status.replaceAll('_',' '))}</small></a>`).join('');
    if(!requested){$('landing').hidden=false;return;}
    if(!current) return fail('That record is not in the manuscript manifest.');
    if(!working && !current.published) return fail('That record is preserved story material but is not publicly released yet.');

    const idx=manifest.records.findIndex(r=>r.id===current.id);
    const prev=manifest.records.slice(0,idx).reverse().find(r=>working||r.published);
    const next=manifest.records.slice(idx+1).find(r=>working||r.published);
    const prose=await fetch(current.path,{cache:'no-store'}).then(r=>{if(!r.ok) throw new Error(current.path);return r.text()});

    $('landing').hidden=true;$('record').hidden=false;
    $('recordNo').textContent=`Record ${current.display||current.slot}`;
    $('title').textContent=current.title.replace(/^THE\s+/i,'THE ');
    $('meta').textContent=`${current.word_count.toLocaleString()} words`;
    $('prose').innerHTML=renderMarkdown(prose);
    if(working||current.prose_status!=='reference') $('statusBadge').innerHTML=`<span class="status">${escapeHtml(current.prose_status.replaceAll('_',' '))}</span>`;

    const available=manifest.records.filter(r=>working||r.published);
    $('recordSelect').innerHTML=available.map(r=>`<option value="${escapeHtml(r.slot)}" ${r.id===current.id?'selected':''}>${escapeHtml(r.display||r.slot)} · ${escapeHtml(r.title)}</option>`).join('');
    $('recordSelect').onchange=e=>location.href=`?record=${encodeURIComponent(e.target.value)}${working?'&work=1':''}`;
    const setNav=(el,rec)=>{if(rec){el.href=`?record=${encodeURIComponent(rec.slot)}${working?'&work=1':''}`;el.classList.remove('disabled')}else{el.removeAttribute('href');el.classList.add('disabled')}};
    setNav($('prev'),prev);setNav($('next'),next);

    const a=audio.records?.[current.id];
    const publicAudio=a?.status==='published';
    const candidateAudio=working&&a?.status==='candidate';
    if((publicAudio||candidateAudio)&&a.src){
      $('audioBox').hidden=false;
      $('player').src=a.src;
      $('audioLabel').textContent=candidateAudio?'Listen · Candidate':'Listen';
      $('meta').textContent+=candidateAudio?' · candidate audio':' · audio available';
    }
    document.title=`${current.display||current.slot} · ${current.title} · 3L`;
  }).catch(err=>fail(`Reader could not load: ${err.message}`));
})();
</script>
</body>
</html>
